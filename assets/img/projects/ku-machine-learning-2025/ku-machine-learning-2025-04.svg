<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">평가 결과를 읽고 다음 실험을 정하기</title><desc id="desc">오류 확인에서 설정 비교로. 예측과 정답 / 맞음과 틀림을 비교 / confusion matrix; 평가 지표 / precision · recall · F1 / 문제의 목적과 함께 읽기; 설정 비교 / 교차 검증 · 탐색 / 같은 기준으로 비교; 기록 / 데이터 · 설정 · 결과 / 다음 실험과 연결</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">평가 결과를 읽고 다음 실험을 정하기</text><text x="56" y="151" font-size="23" fill="#57534e">오류 확인에서 설정 비교로</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">예측과 정답</text><text x="84" y="294" font-size="25" fill="#44403c">맞음과 틀림을 비교</text><text x="84" y="338" font-size="22" fill="#78716c">confusion matrix</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">평가 지표</text><text x="646" y="294" font-size="25" fill="#44403c">precision · recall · F1</text><text x="646" y="338" font-size="22" fill="#78716c">문제의 목적과 함께 읽기</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">설정 비교</text><text x="84" y="499" font-size="25" fill="#44403c">교차 검증 · 탐색</text><text x="84" y="543" font-size="22" fill="#78716c">같은 기준으로 비교</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">기록</text><text x="646" y="499" font-size="25" fill="#44403c">데이터 · 설정 · 결과</text><text x="646" y="543" font-size="22" fill="#78716c">다음 실험과 연결</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">숫자 점수 없이 평가 절차를 설명한 도해입니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>