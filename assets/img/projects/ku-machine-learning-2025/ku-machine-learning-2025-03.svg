<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">서로 다른 질문에는 다른 분석이 필요하다</title><desc id="desc">예측과 탐색의 목적. 분류 / 어느 범주에 속할까? / kNN · 로지스틱 · 트리; 회귀 / 어느 정도의 값일까? / 선형 · 다항 · 다중 회귀; 군집 / 어떤 묶음이 보일까? / KMeans · 계층적 군집; 차원 축소 / 다른 표현으로 볼까? / PCA</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">서로 다른 질문에는 다른 분석이 필요하다</text><text x="56" y="151" font-size="23" fill="#57534e">예측과 탐색의 목적</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">분류</text><text x="84" y="294" font-size="25" fill="#44403c">어느 범주에 속할까?</text><text x="84" y="338" font-size="22" fill="#78716c">kNN · 로지스틱 · 트리</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">회귀</text><text x="646" y="294" font-size="25" fill="#44403c">어느 정도의 값일까?</text><text x="646" y="338" font-size="22" fill="#78716c">선형 · 다항 · 다중 회귀</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">군집</text><text x="84" y="499" font-size="25" fill="#44403c">어떤 묶음이 보일까?</text><text x="84" y="543" font-size="22" fill="#78716c">KMeans · 계층적 군집</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">차원 축소</text><text x="646" y="499" font-size="25" fill="#44403c">다른 표현으로 볼까?</text><text x="646" y="543" font-size="22" fill="#78716c">PCA</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">모델의 우열이 아니라 수업에서 다룬 문제 유형을 비교합니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>