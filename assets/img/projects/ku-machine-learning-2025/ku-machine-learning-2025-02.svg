<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">학습에 쓰는 데이터와 확인할 데이터</title><desc id="desc">분할과 전처리를 구분하는 관점. 원본 데이터 / 입력 특성과 정답 / 목표에 맞는 형태 확인; 훈련 데이터 / 전처리 기준과 모델 학습 / 학습 과정에 사용; 검증 데이터 / 설정 비교와 선택 / 테스트와 역할 구분; 테스트 데이터 / 분리해 둔 데이터로 평가 / 최종 확인의 기준</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">학습에 쓰는 데이터와 확인할 데이터</text><text x="56" y="151" font-size="23" fill="#57534e">분할과 전처리를 구분하는 관점</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">원본 데이터</text><text x="84" y="294" font-size="25" fill="#44403c">입력 특성과 정답</text><text x="84" y="338" font-size="22" fill="#78716c">목표에 맞는 형태 확인</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">훈련 데이터</text><text x="646" y="294" font-size="25" fill="#44403c">전처리 기준과 모델 학습</text><text x="646" y="338" font-size="22" fill="#78716c">학습 과정에 사용</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">검증 데이터</text><text x="84" y="499" font-size="25" fill="#44403c">설정 비교와 선택</text><text x="84" y="543" font-size="22" fill="#78716c">테스트와 역할 구분</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">테스트 데이터</text><text x="646" y="499" font-size="25" fill="#44403c">분리해 둔 데이터로 평가</text><text x="646" y="543" font-size="22" fill="#78716c">최종 확인의 기준</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">분할 비율을 강제하는 그림이 아니며 실제 문제와 실습 설정에 따라 달라집니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>