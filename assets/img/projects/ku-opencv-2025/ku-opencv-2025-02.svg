<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">픽셀 값과 좌표를 나누어 생각하기</title><desc id="desc">서로 다른 영상 처리의 역할. 밝기 / 대비 / 픽셀 값의 분포 / 히스토그램으로 관찰; 필터 / 주변 픽셀의 관계 / 평활화와 경계 보존 비교; 좌표 변환 / 위치의 대응 관계 / 아핀 · 원근 변환; 결과 확인 / 원본과 처리 영상 / 무엇이 달라졌는지 비교</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">픽셀 값과 좌표를 나누어 생각하기</text><text x="56" y="151" font-size="23" fill="#57534e">서로 다른 영상 처리의 역할</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">밝기 / 대비</text><text x="84" y="294" font-size="25" fill="#44403c">픽셀 값의 분포</text><text x="84" y="338" font-size="22" fill="#78716c">히스토그램으로 관찰</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">필터</text><text x="646" y="294" font-size="25" fill="#44403c">주변 픽셀의 관계</text><text x="646" y="338" font-size="22" fill="#78716c">평활화와 경계 보존 비교</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">좌표 변환</text><text x="84" y="499" font-size="25" fill="#44403c">위치의 대응 관계</text><text x="84" y="543" font-size="22" fill="#78716c">아핀 · 원근 변환</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">결과 확인</text><text x="646" y="499" font-size="25" fill="#44403c">원본과 처리 영상</text><text x="646" y="543" font-size="22" fill="#78716c">무엇이 달라졌는지 비교</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">필터의 효과나 처리 속도를 측정한 결과 그림이 아닙니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>