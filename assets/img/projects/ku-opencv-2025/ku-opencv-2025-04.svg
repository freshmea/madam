<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">특징점에서 두 영상의 관계로</title><desc id="desc">ORB 매칭 예제를 읽는 네 단계. 특징 추출 / 기준 영상과 프레임 / KeyPoint · Descriptor; 매칭 / Hamming 거리 / 대응 후보 비교; 변환 추정 / 호모그래피 / 영상 사이의 좌표 관계; 투영 / 표시 / 기준 외곽선 변환 / 카메라 프레임에 표시</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">특징점에서 두 영상의 관계로</text><text x="56" y="151" font-size="23" fill="#57534e">ORB 매칭 예제를 읽는 네 단계</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">특징 추출</text><text x="84" y="294" font-size="25" fill="#44403c">기준 영상과 프레임</text><text x="84" y="338" font-size="22" fill="#78716c">KeyPoint · Descriptor</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">매칭</text><text x="646" y="294" font-size="25" fill="#44403c">Hamming 거리</text><text x="646" y="338" font-size="22" fill="#78716c">대응 후보 비교</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">변환 추정</text><text x="84" y="499" font-size="25" fill="#44403c">호모그래피</text><text x="84" y="543" font-size="22" fill="#78716c">영상 사이의 좌표 관계</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">투영 / 표시</text><text x="646" y="499" font-size="25" fill="#44403c">기준 외곽선 변환</text><text x="646" y="543" font-size="22" fill="#78716c">카메라 프레임에 표시</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">입력·매칭 개수·추정 결과의 유효성 점검은 별도로 필요합니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>