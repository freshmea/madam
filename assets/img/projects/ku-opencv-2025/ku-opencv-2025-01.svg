<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">카메라의 한 프레임을 읽는 순서</title><desc id="desc">입력 · 구조 · 처리 · 표시. 입력 / 이미지 파일 · 카메라 / 읽기와 유효성 확인; 구조 / Mat의 크기 · 타입 / 채널과 픽셀 값; 처리 / 필터 · 변환 · 영역 / 중간 결과 비교; 표시 / 선 · 사각형 · 텍스트 / 결과를 원본과 연결</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">카메라의 한 프레임을 읽는 순서</text><text x="56" y="151" font-size="23" fill="#57534e">입력 · 구조 · 처리 · 표시</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">입력</text><text x="84" y="294" font-size="25" fill="#44403c">이미지 파일 · 카메라</text><text x="84" y="338" font-size="22" fill="#78716c">읽기와 유효성 확인</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">구조</text><text x="646" y="294" font-size="25" fill="#44403c">Mat의 크기 · 타입</text><text x="646" y="338" font-size="22" fill="#78716c">채널과 픽셀 값</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">처리</text><text x="84" y="499" font-size="25" fill="#44403c">필터 · 변환 · 영역</text><text x="84" y="543" font-size="22" fill="#78716c">중간 결과 비교</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">표시</text><text x="646" y="499" font-size="25" fill="#44403c">선 · 사각형 · 텍스트</text><text x="646" y="543" font-size="22" fill="#78716c">결과를 원본과 연결</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">실제 촬영 영상 대신 처리 구조를 도식화했습니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>