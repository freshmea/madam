<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic,sans-serif"><text x="55" y="60" font-size="19" fill="#c2410c">SUBJECT 04 / MODERN C++</text><text x="55" y="120" font-size="39" fill="#292524">데이터를 담고, 처리하고, 함께 실행하기</text><text x="55" y="163" font-size="21" fill="#78716c">2025.04.21–04.25 · 직접 강의한 C++ 후반 수업의 흐름</text><rect x="55" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="280" font-size="27" fill="#c2410c">자료 구조</text><text x="80" y="334" font-size="22" fill="#292524">vector · map · list</text><rect x="440" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="280" font-size="27" fill="#c2410c">처리 동작</text><text x="465" y="334" font-size="22" fill="#292524">반복자 · 람다 · 알고리즘</text><rect x="825" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="280" font-size="27" fill="#c2410c">파일 연동</text><text x="850" y="334" font-size="22" fill="#292524">fstream · sstream</text><rect x="55" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="480" font-size="27" fill="#c2410c">객체 소유</text><text x="80" y="534" font-size="22" fill="#292524">스마트 포인터</text><rect x="440" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="480" font-size="27" fill="#c2410c">이동과 전달</text><text x="465" y="534" font-size="22" fill="#292524">move · forward</text><rect x="825" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="480" font-size="27" fill="#c2410c">여러 작업</text><text x="850" y="534" font-size="22" fill="#292524">thread · async</text><text x="55" y="679" font-size="18" fill="#78716c">강사 수업 기록에 근거한 설명용 개념도 · 실제 수업 사진 아님</text></g></svg>