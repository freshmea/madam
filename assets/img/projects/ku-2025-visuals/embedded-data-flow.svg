<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#c2410c"/></marker></defs><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic, sans-serif"><text x="55" y="57" font-size="18" fill="#c2410c" font-weight="700">03 / INTEGRATION</text><text x="55" y="116" font-size="40" fill="#292524" font-weight="700">측정 → 저장 → 요청 → 출력</text><text x="55" y="158" font-size="21" fill="#78716c" font-weight="400">강사 통합 예제의 역할 분담을 재구성</text><rect x="65" y="320" width="305" height="170" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="90" y="360" font-size="18" fill="#c2410c" font-weight="700">SENSOR</text><text x="90" y="412" font-size="28" fill="#292524" font-weight="700">온습도 센서</text><text x="90" y="453" font-size="23" fill="#292524" font-weight="400">I2C로 측정</text><path d="M377 405 L430 405" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="320" width="305" height="170" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="475" y="360" font-size="18" fill="#c2410c" font-weight="700">STORAGE</text><text x="475" y="412" font-size="28" fill="#292524" font-weight="700">외부 EEPROM</text><text x="475" y="453" font-size="23" fill="#292524" font-weight="400">SPI로 저장·읽기</text><path d="M762 405 L815 405" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><rect x="835" y="320" width="305" height="170" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="860" y="360" font-size="18" fill="#c2410c" font-weight="700">MONITOR</text><text x="860" y="412" font-size="28" fill="#292524" font-weight="700">PC 터미널</text><text x="860" y="453" font-size="23" fill="#292524" font-weight="400">UART로 출력</text><rect x="65" y="205" width="440" height="68" rx="14" fill="#fff7ed" stroke="#fed7aa"/><text x="86" y="247" font-size="24" fill="#292524" font-weight="400">타이머 → 측정 플래그</text><rect x="675" y="205" width="460" height="68" rx="14" fill="#fff7ed" stroke="#fed7aa"/><text x="696" y="247" font-size="24" fill="#292524" font-weight="400">버튼 인터럽트 → 전송 플래그</text><path d="M275 279 L275 308" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><path d="M950 279 L950 308" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><text x="140" y="573" font-size="26" fill="#c2410c" font-weight="700">인터럽트: 처리 시점 알림</text><text x="650" y="573" font-size="26" fill="#c2410c" font-weight="700">메인 반복문: 데이터 처리</text><text x="55" y="682" font-size="17" fill="#78716c" font-weight="400">수업 내용을 바탕으로 재구성한 설명용 도해 · 실제 수업 사진 아님</text></g></svg>