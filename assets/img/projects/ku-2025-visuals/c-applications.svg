<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#c2410c"/></marker></defs><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic, sans-serif"><text x="55" y="57" font-size="18" fill="#c2410c" font-weight="700">03 / APPLICATION STRUCTURE</text><text x="55" y="116" font-size="40" fill="#292524" font-weight="700">입력·처리·출력을 나누어 생각하기</text><text x="55" y="158" font-size="21" fill="#78716c" font-weight="400">도서 관리와 볼링 실습에 공통으로 적용할 수 있는 학습 관점</text><text x="65" y="226" font-size="24" fill="#c2410c" font-weight="700">도서 관리</text><rect x="65" y="250" width="305" height="112" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="89" y="292" font-size="17" fill="#78716c" font-weight="700">INPUT</text><text x="89" y="335" font-size="23" fill="#292524" font-weight="700">메뉴·도서 정보</text><path d="M375 306 L428 306" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="250" width="305" height="112" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="474" y="292" font-size="17" fill="#78716c" font-weight="700">PROCESS</text><text x="474" y="335" font-size="23" fill="#292524" font-weight="700">추가·조회·변경·삭제</text><path d="M760 306 L813 306" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><rect x="835" y="250" width="305" height="112" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="859" y="292" font-size="17" fill="#78716c" font-weight="700">OUTPUT</text><text x="859" y="335" font-size="23" fill="#292524" font-weight="700">MySQL 기록·조회</text><text x="65" y="431" font-size="24" fill="#c2410c" font-weight="700">볼링 점수</text><rect x="65" y="455" width="305" height="112" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="89" y="497" font-size="17" fill="#78716c" font-weight="700">INPUT</text><text x="89" y="540" font-size="23" fill="#292524" font-weight="700">투구별 입력</text><path d="M375 511 L428 511" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="455" width="305" height="112" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="474" y="497" font-size="17" fill="#78716c" font-weight="700">PROCESS</text><text x="474" y="540" font-size="23" fill="#292524" font-weight="700">프레임·보너스 계산</text><path d="M760 511 L813 511" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><rect x="835" y="455" width="305" height="112" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="859" y="497" font-size="17" fill="#78716c" font-weight="700">OUTPUT</text><text x="859" y="540" font-size="23" fill="#292524" font-weight="700">점수판 표시</text><text x="65" y="620" font-size="26" fill="#c2410c" font-weight="700">역할을 나눈 함수가 전체 프로그램의 흐름을 만든다.</text><text x="55" y="682" font-size="17" fill="#78716c" font-weight="400">수업 내용을 바탕으로 재구성한 설명용 도해 · 실제 수업 사진 아님</text></g></svg>