<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#c2410c"/></marker></defs><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic, sans-serif"><text x="55" y="57" font-size="18" fill="#c2410c" font-weight="700">01 / INPUT AND EVENTS</text><text x="55" y="116" font-size="40" fill="#292524" font-weight="700">버튼 입력에서 표시까지</text><text x="55" y="158" font-size="21" fill="#78716c" font-weight="400">스위치·디바운싱·인터럽트를 연결해서 이해하기</text><rect x="55" y="260" width="240" height="195" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="80" y="308" font-size="21" fill="#c2410c" font-weight="700">입력</text><text x="80" y="372" font-size="26" fill="#292524" font-weight="700">스위치 변화</text><path d="M302 358 L334 358" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><rect x="347" y="260" width="240" height="195" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="372" y="308" font-size="21" fill="#c2410c" font-weight="700">입력 처리</text><text x="372" y="372" font-size="26" fill="#292524" font-weight="700">디바운싱</text><path d="M594 358 L626 358" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><rect x="639" y="260" width="240" height="195" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="664" y="308" font-size="21" fill="#c2410c" font-weight="700">상태 변경</text><text x="664" y="372" font-size="26" fill="#292524" font-weight="700">이벤트 처리</text><path d="M886 358 L918 358" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><rect x="931" y="260" width="240" height="195" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="956" y="308" font-size="21" fill="#c2410c" font-weight="700">출력</text><text x="956" y="372" font-size="26" fill="#292524" font-weight="700">FND 숫자</text><rect x="55" y="505" width="1090" height="106" rx="14" fill="#fff7ed" stroke="#fed7aa"/><text x="85" y="550" font-size="26" fill="#292524" font-weight="700">한 번 눌렀다는 의도와 실제 입력 신호를 구분</text><text x="85" y="589" font-size="23" fill="#292524" font-weight="400">수업에서는 지연 함수 없이 입력을 처리하는 방법도 함께 다뤘다.</text><text x="55" y="682" font-size="17" fill="#78716c" font-weight="400">수업 내용을 바탕으로 재구성한 설명용 도해 · 실제 수업 사진 아님</text></g></svg>