<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic,sans-serif"><text x="55" y="60" font-size="19" fill="#c2410c">SUBJECT 04 / MODERN C++</text><text x="55" y="120" font-size="39" fill="#292524">자료와 처리 동작을 나누어 구성하기</text><text x="55" y="163" font-size="21" fill="#78716c">컨테이너·반복자·알고리즘을 연결하는 학습 관점</text><rect x="55" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="280" font-size="27" fill="#c2410c">저장</text><text x="80" y="334" font-size="22" fill="#292524">컨테이너에 값 보관</text><rect x="440" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="280" font-size="27" fill="#c2410c">접근</text><text x="465" y="334" font-size="22" fill="#292524">반복자로 원소 순회</text><rect x="825" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="280" font-size="27" fill="#c2410c">처리</text><text x="850" y="334" font-size="22" fill="#292524">검색 · 정렬 · 변환</text><rect x="55" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="480" font-size="27" fill="#c2410c">입력</text><text x="80" y="534" font-size="22" fill="#292524">파일에서 읽기</text><rect x="440" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="480" font-size="27" fill="#c2410c">구조화</text><text x="465" y="534" font-size="22" fill="#292524">클래스로 역할 묶기</text><rect x="825" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="480" font-size="27" fill="#c2410c">결과</text><text x="850" y="534" font-size="22" fill="#292524">필요한 데이터 출력</text><text x="55" y="679" font-size="18" fill="#78716c">강사 수업 기록에 근거한 설명용 개념도 · 실제 수업 사진 아님</text></g></svg>