<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic,sans-serif"><text x="55" y="60" font-size="19" fill="#c2410c">SUBJECT 03 / RASPBERRY PI &amp; LINUX</text><text x="55" y="120" font-size="40" fill="#292524">사용자 프로그램과 장치 사이의 계층</text><text x="55" y="163" font-size="22" fill="#78716c">개념적인 역할 구분 · 실제 호출 경로는 구현에 따라 다름</text><rect x="55" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="280" font-size="28" fill="#c2410c">사용자 영역</text><text x="80" y="334" font-size="23" fill="#292524">장치에 동작 요청</text><text x="380" y="320" font-size="35" fill="#c2410c">→</text><rect x="440" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="280" font-size="28" fill="#c2410c">커널 영역</text><text x="465" y="334" font-size="23" fill="#292524">드라이버에서 처리</text><text x="765" y="320" font-size="35" fill="#c2410c">→</text><rect x="825" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="280" font-size="28" fill="#c2410c">하드웨어</text><text x="850" y="334" font-size="23" fill="#292524">GPIO 상태 변화</text><rect x="55" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="480" font-size="28" fill="#c2410c">관찰</text><text x="80" y="534" font-size="23" fill="#292524">시스템 호출 확인</text><text x="380" y="520" font-size="35" fill="#c2410c">→</text><rect x="440" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="480" font-size="28" fill="#c2410c">모듈</text><text x="465" y="534" font-size="23" fill="#292524">로드 · 언로드</text><text x="765" y="520" font-size="35" fill="#c2410c">→</text><rect x="825" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="480" font-size="28" fill="#c2410c">결과</text><text x="850" y="534" font-size="23" fill="#292524">LED · 스위치 확인</text><text x="55" y="679" font-size="18" fill="#78716c">강사 수업 기록을 바탕으로 직접 제작한 개념도 · 실제 수업 사진 아님</text></g></svg>