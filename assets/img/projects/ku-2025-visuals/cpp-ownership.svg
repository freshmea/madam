<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic,sans-serif"><text x="55" y="60" font-size="19" fill="#c2410c">SUBJECT 04 / MODERN C++</text><text x="55" y="120" font-size="39" fill="#292524">포인터를 읽을 때 소유 관계도 함께</text><text x="55" y="163" font-size="21" fill="#78716c">이동과 공유 소유는 서로 다른 개념</text><rect x="55" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="280" font-size="27" fill="#c2410c">unique_ptr</text><text x="80" y="334" font-size="22" fill="#292524">단독 소유</text><rect x="440" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="280" font-size="27" fill="#c2410c">shared_ptr</text><text x="465" y="334" font-size="22" fill="#292524">공유 소유</text><rect x="825" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="280" font-size="27" fill="#c2410c">weak_ptr</text><text x="850" y="334" font-size="22" fill="#292524">소유권 없이 관찰</text><rect x="55" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="480" font-size="27" fill="#c2410c">수명</text><text x="80" y="534" font-size="22" fill="#292524">객체의 생존 범위</text><rect x="440" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="480" font-size="27" fill="#c2410c">관계</text><text x="465" y="534" font-size="22" fill="#292524">순환 참조 점검</text><rect x="825" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="480" font-size="27" fill="#c2410c">이동</text><text x="850" y="534" font-size="22" fill="#292524">자원을 넘기는 구조</text><text x="55" y="679" font-size="18" fill="#78716c">강사 수업 기록에 근거한 설명용 개념도 · 실제 수업 사진 아님</text></g></svg>