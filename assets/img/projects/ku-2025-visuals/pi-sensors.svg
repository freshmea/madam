<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic,sans-serif"><text x="55" y="60" font-size="19" fill="#c2410c">SUBJECT 03 / RASPBERRY PI &amp; LINUX</text><text x="55" y="120" font-size="40" fill="#292524">같은 센서 실습, 서로 다른 연결 방식</text><text x="55" y="163" font-size="22" fill="#78716c">핀 배치와 통신 방식을 구분하여 확인</text><rect x="55" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="280" font-size="28" fill="#c2410c">GPIO 입력</text><text x="80" y="334" font-size="23" fill="#292524">PIR · 스위치</text><text x="380" y="320" font-size="35" fill="#c2410c">→</text><rect x="440" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="280" font-size="28" fill="#c2410c">이벤트 처리</text><text x="465" y="334" font-size="23" fill="#292524">입력 변화 확인</text><text x="765" y="320" font-size="35" fill="#c2410c">→</text><rect x="825" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="280" font-size="28" fill="#c2410c">표시 장치</text><text x="850" y="334" font-size="23" fill="#292524">LED · FND</text><rect x="55" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="480" font-size="28" fill="#c2410c">I2C 센서</text><text x="80" y="534" font-size="23" fill="#292524">SHT20 · MPU6050</text><text x="380" y="520" font-size="35" fill="#c2410c">→</text><rect x="440" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="480" font-size="28" fill="#c2410c">측정값 처리</text><text x="465" y="534" font-size="23" fill="#292524">온습도 · 움직임</text><text x="765" y="520" font-size="35" fill="#c2410c">→</text><rect x="825" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="480" font-size="28" fill="#c2410c">반응</text><text x="850" y="534" font-size="23" fill="#292524">부저 · LED</text><text x="55" y="679" font-size="18" fill="#78716c">강사 수업 기록을 바탕으로 직접 제작한 개념도 · 실제 수업 사진 아님</text></g></svg>