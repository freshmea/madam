<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#c2410c"/></marker></defs><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic, sans-serif"><text x="55" y="57" font-size="18" fill="#c2410c" font-weight="700">02 / ARRAYS AND POINTERS</text><text x="55" y="116" font-size="40" fill="#292524" font-weight="700">값이 놓인 자리와 가리키는 관계</text><text x="55" y="158" font-size="21" fill="#78716c" font-weight="400">배열과 포인터의 관계를 설명하는 개념도 · 실제 주소값 생략</text><rect x="70" y="230" width="300" height="150" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="97" y="278" font-size="28" fill="#c2410c" font-weight="700">포인터 p</text><text x="97" y="326" font-size="22" fill="#292524" font-weight="400">첫 원소의 주소를 보관</text><text x="500" y="255" font-size="20" fill="#78716c" font-weight="400">values[0]</text><rect x="485" y="278" width="135" height="115" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="525" y="349" font-size="38" fill="#292524" font-weight="700">10</text><text x="650" y="255" font-size="20" fill="#78716c" font-weight="400">values[1]</text><rect x="635" y="278" width="135" height="115" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="675" y="349" font-size="38" fill="#292524" font-weight="700">20</text><text x="800" y="255" font-size="20" fill="#78716c" font-weight="400">values[2]</text><rect x="785" y="278" width="135" height="115" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="825" y="349" font-size="38" fill="#292524" font-weight="700">30</text><text x="950" y="255" font-size="20" fill="#78716c" font-weight="400">values[3]</text><rect x="935" y="278" width="135" height="115" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="975" y="349" font-size="38" fill="#292524" font-weight="700">40</text><path d="M370 308 L473 308" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><text x="505" y="455" font-size="26" fill="#c2410c" font-weight="700">연속된 배열 원소</text><rect x="70" y="515" width="1055" height="95" rx="14" fill="#fff7ed" stroke="#fed7aa"/><text x="100" y="555" font-size="24" fill="#292524" font-weight="700">함수에 배열을 전달할 때</text><text x="100" y="590" font-size="23" fill="#292524" font-weight="400">시작 위치와 원소 개수를 함께 생각하며 접근 범위를 확인한다.</text><text x="55" y="682" font-size="17" fill="#78716c" font-weight="400">수업 내용을 바탕으로 재구성한 설명용 도해 · 실제 수업 사진 아님</text></g></svg>