<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#c2410c"/></marker></defs><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic, sans-serif"><text x="55" y="57" font-size="18" fill="#c2410c" font-weight="700">SUBJECT 01 / C PROGRAMMING</text><text x="55" y="116" font-size="40" fill="#292524" font-weight="700">작은 코드에서 하나의 프로그램으로</text><text x="55" y="158" font-size="21" fill="#78716c" font-weight="400">2025.03.04–03.17 · 환경 구축에서 종합 실습까지</text><rect x="65" y="210" width="670" height="380" rx="20" fill="#292524" stroke="#292524"/><rect x="87" y="235" width="626" height="326" rx="8" fill="#1c1917" stroke="#44403c"/><text x="112" y="270" font-size="19" fill="#fdba74" font-weight="700">SOURCE → BUILD → RUN</text><text x="115" y="315" font-size="24" fill="#fafaf9" font-weight="400">int main(void) {</text><text x="115" y="349" font-size="24" fill="#fafaf9" font-weight="400">    int total = 0;</text><text x="115" y="383" font-size="24" fill="#fdba74" font-weight="400">    for (int i = 1; i &lt;= 10; ++i)</text><text x="115" y="417" font-size="24" fill="#fafaf9" font-weight="400">        total += i;</text><text x="115" y="451" font-size="24" fill="#fafaf9" font-weight="400">    return 0;</text><text x="115" y="485" font-size="24" fill="#fafaf9" font-weight="400">}</text><rect x="320" y="590" width="160" height="18" rx="2" fill="#292524" stroke="#292524"/><rect x="260" y="609" width="280" height="14" rx="5" fill="#292524" stroke="#292524"/><rect x="790" y="220" width="350" height="108" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="818" y="257" font-size="22" fill="#c2410c" font-weight="700">01  환경</text><text x="818" y="294" font-size="22" fill="#292524" font-weight="400">Linux · Git · Make</text><rect x="790" y="350" width="350" height="108" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="818" y="387" font-size="22" fill="#c2410c" font-weight="700">02  구조</text><text x="818" y="424" font-size="22" fill="#292524" font-weight="400">배열 · 포인터 · 함수</text><rect x="790" y="480" width="350" height="108" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="818" y="517" font-size="22" fill="#c2410c" font-weight="700">03  연결</text><text x="818" y="554" font-size="22" fill="#292524" font-weight="400">MySQL · CMake</text><path d="M738 400 L780 400" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="682" font-size="17" fill="#78716c" font-weight="400">수업 내용을 바탕으로 재구성한 설명용 도해 · 실제 수업 사진 아님</text></g></svg>