<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#c2410c"/></marker></defs><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic, sans-serif"><text x="55" y="57" font-size="18" fill="#c2410c" font-weight="700">02 / TIMER AND OUTPUT</text><text x="55" y="116" font-size="40" fill="#292524" font-weight="700">시간을 세고, 출력 파형을 만들기</text><text x="55" y="158" font-size="21" fill="#78716c" font-weight="400">타이머·PWM의 역할을 보여주는 개념도 · 특정 장치의 설정값 아님</text><rect x="55" y="235" width="400" height="325" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="85" y="282" font-size="27" fill="#292524" font-weight="700">PWM 신호의 예</text><polyline points="85,345 85,300 110,300 110,345 185,345 185,345 185,300 210,300 210,345 285,345 285,345 285,300 310,300 310,345 385,345 385,345 385,300" fill="none" stroke="#c2410c" stroke-width="4"/><polyline points="85,450 85,405 150,405 150,450 185,450 185,450 185,405 250,405 250,450 285,450 285,450 285,405 350,405 350,450 385,450 385,450 385,405" fill="none" stroke="#c2410c" stroke-width="4"/><text x="85" y="515" font-size="22" fill="#78716c" font-weight="400">출력이 켜져 있는 비율 비교</text><rect x="555" y="235" width="590" height="95" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="580" y="273" font-size="24" fill="#c2410c" font-weight="700">LED·FND</text><text x="580" y="308" font-size="23" fill="#292524" font-weight="400">시간 경과에 맞춘 표시</text><rect x="555" y="352" width="590" height="95" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="580" y="390" font-size="24" fill="#c2410c" font-weight="700">부저</text><text x="580" y="425" font-size="23" fill="#292524" font-weight="400">파형에 따른 소리 출력</text><rect x="555" y="469" width="590" height="95" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="580" y="507" font-size="24" fill="#c2410c" font-weight="700">서보·DC 모터</text><text x="580" y="542" font-size="23" fill="#292524" font-weight="400">장치 특성에 맞춘 제어</text><path d="M469 390 L541 390" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><text x="55" y="682" font-size="17" fill="#78716c" font-weight="400">수업 내용을 바탕으로 재구성한 설명용 도해 · 실제 수업 사진 아님</text></g></svg>