<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img"><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10" fill="#c2410c"/></marker></defs><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic, sans-serif"><text x="55" y="57" font-size="18" fill="#c2410c" font-weight="700">01 / DEVELOPMENT CYCLE</text><text x="55" y="116" font-size="40" fill="#292524" font-weight="700">수정한 코드는 어떻게 실행될까?</text><text x="55" y="158" font-size="21" fill="#78716c" font-weight="400">소스 수정 → 빌드 → 실행 → 결과 확인의 반복</text><rect x="65" y="245" width="300" height="250" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="93" y="290" font-size="20" fill="#c2410c" font-weight="700">SOURCE</text><text x="93" y="350" font-size="31" fill="#292524" font-weight="700">소스 작성</text><text x="93" y="400" font-size="22" fill="#292524" font-weight="400">C 파일 · 헤더 파일</text><path d="M375 365 L430 365" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><rect x="450" y="245" width="300" height="250" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="478" y="290" font-size="20" fill="#c2410c" font-weight="700">BUILD</text><text x="478" y="350" font-size="31" fill="#292524" font-weight="700">빌드 구성</text><text x="478" y="400" font-size="22" fill="#292524" font-weight="400">Make · CMake</text><path d="M760 365 L815 365" fill="none" stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"/><rect x="835" y="245" width="300" height="250" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="863" y="290" font-size="20" fill="#c2410c" font-weight="700">RUN</text><text x="863" y="350" font-size="31" fill="#292524" font-weight="700">실행과 확인</text><text x="863" y="400" font-size="22" fill="#292524" font-weight="400">터미널 · 디버거</text><path d="M985 510 V575 H215 V510" stroke="#c2410c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="390" y="620" font-size="26" fill="#c2410c" font-weight="700">오류와 결과를 읽고 다시 수정</text><text x="55" y="682" font-size="17" fill="#78716c" font-weight="400">수업 내용을 바탕으로 재구성한 설명용 도해 · 실제 수업 사진 아님</text></g></svg>