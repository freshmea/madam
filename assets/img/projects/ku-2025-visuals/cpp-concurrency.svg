<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720"><rect width="1200" height="720" fill="#f5f2ea"/><g font-family="Malgun Gothic,sans-serif"><text x="55" y="60" font-size="19" fill="#c2410c">SUBJECT 04 / MODERN C++</text><text x="55" y="120" font-size="39" fill="#292524">작업 분리와 공유 상태를 구분하기</text><text x="55" y="163" font-size="21" fill="#78716c">수업의 동시성 개념을 역할별로 재구성</text><rect x="55" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="280" font-size="27" fill="#c2410c">thread</text><text x="80" y="334" font-size="22" fill="#292524">별도 실행 흐름</text><rect x="440" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="280" font-size="27" fill="#c2410c">mutex</text><text x="465" y="334" font-size="22" fill="#292524">공유 접근 조정</text><rect x="825" y="230" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="280" font-size="27" fill="#c2410c">join</text><text x="850" y="334" font-size="22" fill="#292524">스레드 종료 대기</text><rect x="55" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="80" y="480" font-size="27" fill="#c2410c">async</text><text x="80" y="534" font-size="22" fill="#292524">비동기 정책의 작업</text><rect x="440" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="465" y="480" font-size="27" fill="#c2410c">future</text><text x="465" y="534" font-size="22" fill="#292524">결과·완료 상태 받기</text><rect x="825" y="430" width="310" height="150" rx="15" fill="#fff" stroke="#d6d3d1"/><text x="850" y="480" font-size="27" fill="#c2410c">로그</text><text x="850" y="534" font-size="22" fill="#292524">실행 흐름 관찰</text><text x="55" y="679" font-size="18" fill="#78716c">강사 수업 기록에 근거한 설명용 개념도 · 실제 수업 사진 아님</text></g></svg>