<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t"><title id="t">통신 수단이 바뀌어도 같은 의미로 읽는 데이터</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><rect width="1200" height="680" rx="20" fill="#faf7f1"/><g font-family="Malgun Gothic,sans-serif" fill="#292524"><text x="50" y="60" font-size="29" font-weight="700">통신 수단이 바뀌어도 같은 의미로 읽는 데이터</text><rect x="55" y="125" width="390" height="125" rx="14" fill="#dbeafe" stroke="#d6d3d1"/><text x="250.0" y="163" text-anchor="middle" font-size="22">장치별 입력</text><text x="250.0" y="198" text-anchor="middle" font-size="22">토픽 · 문자열 · 시리얼 데이터</text><path d="M460 185L570 185" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><rect x="595" y="115" width="545" height="145" rx="14" fill="#ffedd5" stroke="#d6d3d1"/><text x="867.5" y="153" text-anchor="middle" font-size="22">Adapter / Collector</text><text x="867.5" y="188" text-anchor="middle" font-size="22">장치별 형식을 공통 이벤트로 변환</text><rect x="130" y="340" width="940" height="225" rx="14" fill="#dcfce7" stroke="#d6d3d1"/><text x="600.0" y="378" text-anchor="middle" font-size="22">공통 이벤트에서 확인할 정보</text><text x="600.0" y="413" text-anchor="middle" font-size="22">device_id · sensor_id → 어느 장치의 무엇인가</text><text x="600.0" y="448" text-anchor="middle" font-size="22">value · unit → 어떤 값이며 단위는 무엇인가</text><text x="600.0" y="483" text-anchor="middle" font-size="22">timestamp · quality → 언제 얻었고 어떤 상태인가</text><path d="M850 275L850 325" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><text x="65" y="625" font-size="22">2026 가이드의 SensorEvent 필드를 발췌한 도해. 실제 센서 로그가 아닙니다.</text></g></svg>