<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t"><title id="t">통신 함수에서 토픽과 메시지의 약속으로</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><rect width="1200" height="680" rx="20" fill="#faf7f1"/><g font-family="Malgun Gothic,sans-serif" fill="#292524"><text x="50" y="60" font-size="29" font-weight="700">통신 함수에서 토픽과 메시지의 약속으로</text><rect x="55" y="265" width="270" height="140" rx="14" fill="#dbeafe" stroke="#d6d3d1"/><text x="190.0" y="303" text-anchor="middle" font-size="22">C 발행 프로그램</text><text x="190.0" y="338" text-anchor="middle" font-size="22">topic + payload</text><text x="190.0" y="373" text-anchor="middle" font-size="22">MQTT publish</text><rect x="450" y="265" width="290" height="140" rx="14" fill="#ffedd5" stroke="#d6d3d1"/><text x="595.0" y="303" text-anchor="middle" font-size="22">브로커</text><text x="595.0" y="338" text-anchor="middle" font-size="22">토픽에 따라 전달</text><text x="595.0" y="373" text-anchor="middle" font-size="22">연결된 구독자</text><rect x="860" y="115" width="285" height="120" rx="14" fill="#dcfce7" stroke="#d6d3d1"/><text x="1002.5" y="153" text-anchor="middle" font-size="22">구독자 A</text><text x="1002.5" y="188" text-anchor="middle" font-size="22">터미널에서 메시지 확인</text><rect x="860" y="425" width="285" height="120" rx="14" fill="#dcfce7" stroke="#d6d3d1"/><text x="1002.5" y="463" text-anchor="middle" font-size="22">구독자 B</text><text x="1002.5" y="498" text-anchor="middle" font-size="22">수집 프로그램으로 확장</text><path d="M340 335L435 335" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><path d="M755 305L845 180" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><path d="M755 375L845 480" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><text x="60" y="120" font-size="22">발행자는 수신 화면의 주소 대신 브로커와 토픽을 사용합니다.</text><text x="60" y="590" font-size="21">실제 mqttPub.c는 발행 예제입니다. 구독·저장·화면은 별도 구현 역할입니다.</text><text x="60" y="630" font-size="21">그림의 두 구독자는 역할 설명용이며 실제 동시 접속 측정 결과가 아닙니다.</text></g></svg>