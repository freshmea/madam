<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">입력의 구조에 따라 모델을 살펴보기</title><desc id="desc">이미지와 순차 데이터. 이미지 / 픽셀과 채널 / 입력 크기와 정규화; CNN / 합성곱층 · 풀링층 / 분류 출력 확인; 순차 데이터 / 토큰 · 순서 · 길이 / one-hot과 embedding; RNN 계열 / RNN · LSTM · GRU / 상태와 메모리 사용 검토</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">입력의 구조에 따라 모델을 살펴보기</text><text x="56" y="151" font-size="23" fill="#57534e">이미지와 순차 데이터</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">이미지</text><text x="84" y="294" font-size="25" fill="#44403c">픽셀과 채널</text><text x="84" y="338" font-size="22" fill="#78716c">입력 크기와 정규화</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">CNN</text><text x="646" y="294" font-size="25" fill="#44403c">합성곱층 · 풀링층</text><text x="646" y="338" font-size="22" fill="#78716c">분류 출력 확인</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">순차 데이터</text><text x="84" y="499" font-size="25" fill="#44403c">토큰 · 순서 · 길이</text><text x="84" y="543" font-size="22" fill="#78716c">one-hot과 embedding</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">RNN 계열</text><text x="646" y="499" font-size="25" fill="#44403c">RNN · LSTM · GRU</text><text x="646" y="543" font-size="22" fill="#78716c">상태와 메모리 사용 검토</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">이미지→CNN, 순차 데이터→RNN의 두 예시 경로를 비교한 그림입니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>