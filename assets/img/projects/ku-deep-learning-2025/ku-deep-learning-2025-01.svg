<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">학습한 모델을 사용하는 프로그램으로</title><desc id="desc">학습 · 저장 · 호출 · 결과. 데이터와 모델 / 입력 표현 · 신경망 / CNN · 순차 데이터 모델; 학습 관리 / 손실 · optimizer / 체크포인트 · 조기 종료; 호출 / 저장한 모델 불러오기 / 요청 데이터 전처리; 결과 사용 / 예측을 응답하고 표시 / 다른 코드와 연결</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">학습한 모델을 사용하는 프로그램으로</text><text x="56" y="151" font-size="23" fill="#57534e">학습 · 저장 · 호출 · 결과</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">데이터와 모델</text><text x="84" y="294" font-size="25" fill="#44403c">입력 표현 · 신경망</text><text x="84" y="338" font-size="22" fill="#78716c">CNN · 순차 데이터 모델</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">학습 관리</text><text x="646" y="294" font-size="25" fill="#44403c">손실 · optimizer</text><text x="646" y="338" font-size="22" fill="#78716c">체크포인트 · 조기 종료</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">호출</text><text x="84" y="499" font-size="25" fill="#44403c">저장한 모델 불러오기</text><text x="84" y="543" font-size="22" fill="#78716c">요청 데이터 전처리</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">결과 사용</text><text x="646" y="499" font-size="25" fill="#44403c">예측을 응답하고 표시</text><text x="646" y="543" font-size="22" fill="#78716c">다른 코드와 연결</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">모델 정확도나 운영 서비스의 성능을 나타내지 않습니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>