<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">후반 수업의 범위를 나누어 기록하기</title><desc id="desc">서로 다른 학습 활동을 구분. 모델 학습 / CNN · 순환 신경망 / 입력과 학습 과정; 모델 활용 / 분류 · 검출 · 호출 / 기존 모델과 코드 연결; 프로젝트 / 6월 19일 오전 / 팀별 작업 시간; 개발 도구 / 6월 20일 / Copilot · agent · MCP</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">후반 수업의 범위를 나누어 기록하기</text><text x="56" y="151" font-size="23" fill="#57534e">서로 다른 학습 활동을 구분</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">모델 학습</text><text x="84" y="294" font-size="25" fill="#44403c">CNN · 순환 신경망</text><text x="84" y="338" font-size="22" fill="#78716c">입력과 학습 과정</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">모델 활용</text><text x="646" y="294" font-size="25" fill="#44403c">분류 · 검출 · 호출</text><text x="646" y="338" font-size="22" fill="#78716c">기존 모델과 코드 연결</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">프로젝트</text><text x="84" y="499" font-size="25" fill="#44403c">6월 19일 오전</text><text x="84" y="543" font-size="22" fill="#78716c">팀별 작업 시간</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">개발 도구</text><text x="646" y="499" font-size="25" fill="#44403c">6월 20일</text><text x="646" y="543" font-size="22" fill="#78716c">Copilot · agent · MCP</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">2025년 당시 기록이며 현재 제품 기능이나 프로젝트 완성도를 뜻하지 않습니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>