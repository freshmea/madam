<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">추론을 별도 프로세스에 요청하기</title><desc id="desc">수업 예제의 ZeroMQ ipc 연결. 클라이언트 / 배열 또는 숫자열 준비 / 요청 데이터 전송; IPC 요청 / 같은 호스트의 프로세스 / ZeroMQ 요청·응답; 모델 서버 / 전처리 후 predict / 저장 모델 사용; 응답 / 예측 값을 돌려주기 / 호출 프로그램에서 활용</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">추론을 별도 프로세스에 요청하기</text><text x="56" y="151" font-size="23" fill="#57534e">수업 예제의 ZeroMQ ipc 연결</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">클라이언트</text><text x="84" y="294" font-size="25" fill="#44403c">배열 또는 숫자열 준비</text><text x="84" y="338" font-size="22" fill="#78716c">요청 데이터 전송</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">IPC 요청</text><text x="646" y="294" font-size="25" fill="#44403c">같은 호스트의 프로세스</text><text x="646" y="338" font-size="22" fill="#78716c">ZeroMQ 요청·응답</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">모델 서버</text><text x="84" y="499" font-size="25" fill="#44403c">전처리 후 predict</text><text x="84" y="543" font-size="22" fill="#78716c">저장 모델 사용</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">응답</text><text x="646" y="499" font-size="25" fill="#44403c">예측 값을 돌려주기</text><text x="646" y="543" font-size="22" fill="#78716c">호출 프로그램에서 활용</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">원격 배포 실적이 아닌 저장소의 로컬 IPC 예제 구조입니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>