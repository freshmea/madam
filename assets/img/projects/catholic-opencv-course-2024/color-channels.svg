<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f4f1e9"/><style>text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#292524}.t{font-size:28px;font-weight:700}.s{font-size:23px}.n{font-size:30px;font-family:monospace}</style><text x="50" y="66" font-size="34" font-weight="700">같은 채널도 묶는 순서에 따라 달라지는 색</text><text class="s" x="50" y="110">a9_split_merge.py · BGR 입력을 RGB 순서로 재구성</text><text class="t" x="50" y="185">OpenCV에서 읽은 BGR</text><rect x="580" y="143" width="155" height="110" rx="12" fill="#2563eb"/><text x="636" y="216" font-size="48" style="fill:white">B</text><rect x="760" y="143" width="155" height="110" rx="12" fill="#16a34a"/><text x="816" y="216" font-size="48" style="fill:white">G</text><rect x="940" y="143" width="155" height="110" rx="12" fill="#dc2626"/><text x="996" y="216" font-size="48" style="fill:white">R</text><text class="t" x="50" y="360">표시를 위해 다시 묶은 RGB</text><rect x="580" y="318" width="155" height="110" rx="12" fill="#dc2626"/><text x="636" y="391" font-size="48" style="fill:white">R</text><rect x="760" y="318" width="155" height="110" rx="12" fill="#16a34a"/><text x="816" y="391" font-size="48" style="fill:white">G</text><rect x="940" y="318" width="155" height="110" rx="12" fill="#2563eb"/><text x="996" y="391" font-size="48" style="fill:white">B</text><text class="s" x="50" y="550">split()으로 분리한 채널을 merge((r, g, b)) 순서로 다시 묶는 예제</text></svg>