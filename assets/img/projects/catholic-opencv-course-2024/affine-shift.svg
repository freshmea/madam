<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f4f1e9"/><style>text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#292524}.t{font-size:28px;font-weight:700}.s{font-size:23px}.n{font-size:30px;font-family:monospace}</style><text x="50" y="66" font-size="34" font-weight="700">좌표를 바꿔 프레임의 위치 이동하기</text><text class="s" x="50" y="110">a13_warpAffine.py · 실제 warpAffine 호출에 사용한 M2</text><g stroke="#ddd6c9" stroke-width="1"><path d="M100 190v320"/><path d="M180 190v320"/><path d="M260 190v320"/><path d="M340 190v320"/><path d="M420 190v320"/><path d="M500 190v320"/><path d="M580 190v320"/><path d="M660 190v320"/><path d="M740 190v320"/><path d="M820 190v320"/><path d="M900 190v320"/><path d="M980 190v320"/><path d="M1060 190v320"/><path d="M100 190h960"/><path d="M100 270h960"/><path d="M100 350h960"/><path d="M100 430h960"/><path d="M100 510h960"/></g><path d="M200 430V230H400Z" fill="#bfdbfe" stroke="#2563eb" stroke-width="4"/><path d="M500 430V230H700Z" fill="#fed7aa" stroke="#c2410c" stroke-width="4"/><path d="M410 350h70l-15 -10m15 10l-15 10" stroke="#292524" stroke-width="4" fill="none"/><text class="t" x="750" y="290">x′ = x + 30</text><text class="t" x="750" y="345">y′ = y</text><text class="s" x="100" y="550">도형은 설명용입니다. 원본의 세 점 대응은 가로 30픽셀 이동을 나타냅니다.</text></svg>