<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f4f1e9"/><style>text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#292524}.t{font-size:28px;font-weight:700}.s{font-size:23px}.n{font-size:30px;font-family:monospace}</style><text x="50" y="66" font-size="34" font-weight="700">ROS2 영상 메시지를 OpenCV 화면으로</text><text class="s" x="50" y="110">simple_camera_viwer.py · 원본 파일 이름의 viwer 표기를 유지</text><rect x="50" y="190" width="350" height="280" rx="14" fill="#fff"/><text class="t" x="74" y="238">메시지 수신</text><text class="s" x="74" y="290">/image_raw/compressed</text><text class="s" x="74" y="329">CompressedImage</text><text class="s" x="74" y="368">구독 콜백 sub_image</text><rect x="425" y="190" width="350" height="280" rx="14" fill="#fff"/><text class="t" x="449" y="238">영상으로 변환</text><text class="s" x="449" y="290">CvBridge</text><text class="s" x="449" y="329">bgr8로 변환</text><text class="s" x="449" y="368">OpenCV 배열</text><rect x="800" y="190" width="350" height="280" rx="14" fill="#fff"/><text class="t" x="824" y="238">화면 표시</text><text class="s" x="824" y="290">imshow(&quot;image&quot;, frame)</text><text class="s" x="824" y="329">waitKey(1)</text><text class="s" x="824" y="368">다음 메시지 대기</text><text class="s" x="50" y="555">영상 구독과 별도로 /cmd_vel 이동 예제가 존재합니다. 자동 추적 통합은 확인하지 않았습니다.</text></svg>