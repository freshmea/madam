<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f4f1e9"/><style>text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#292524}.t{font-size:28px;font-weight:700}.s{font-size:23px}.n{font-size:30px;font-family:monospace}</style><text x="50" y="66" font-size="34" font-weight="700">영상 데이터를 코드로 다루는 수업</text><text class="s" x="50" y="110">2024.01 · 가톨릭관동대 교육 저장소의 예제를 연결한 구성</text><rect x="50" y="200" width="350" height="270" rx="14" fill="#fff"/><text class="t" x="74" y="248">01 / PYTHON</text><text class="s" x="74" y="300">함수 · 클래스</text><text class="s" x="74" y="339">배열의 인덱스</text><text class="s" x="74" y="378">값과 참조 구분</text><rect x="425" y="200" width="350" height="270" rx="14" fill="#fff"/><text class="t" x="449" y="248">02 / OPENCV</text><text class="s" x="449" y="300">채널 · 프레임</text><text class="s" x="449" y="339">도형과 좌표 변환</text><text class="s" x="449" y="378">화면에 결과 표시</text><rect x="800" y="200" width="350" height="270" rx="14" fill="#fff"/><text class="t" x="824" y="248">03 / ROS2</text><text class="s" x="824" y="300">영상 메시지 구독</text><text class="s" x="824" y="339">CvBridge 변환</text><text class="s" x="824" y="378">콜백에서 영상 표시</text><text class="s" x="50" y="555">입력 데이터를 이해하고 → 필요한 형태로 바꾸고 → 노드로 전달하기</text></svg>