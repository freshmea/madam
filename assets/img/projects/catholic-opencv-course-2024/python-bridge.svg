<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f4f1e9"/><style>text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#292524}.t{font-size:28px;font-weight:700}.s{font-size:23px}.n{font-size:30px;font-family:monospace}</style><text x="50" y="66" font-size="34" font-weight="700">문법을 영상 처리의 구조로 연결하기</text><text class="s" x="50" y="110">저장소의 기초 문법 파일과 영상·노드 예제를 함께 읽기</text><rect x="50" y="170" width="520" height="365" rx="14" fill="#fff"/><text class="t" x="74" y="218">Python 기초</text><text class="s" x="74" y="270">입력 → 타입 변환 → 조건 판단</text><text class="s" x="74" y="309">리스트와 반복문으로 값 다루기</text><text class="s" x="74" y="348">함수와 클래스로 기능 나누기</text><rect x="620" y="170" width="530" height="365" rx="14" fill="#fff"/><text class="t" x="644" y="218">영상 실습으로 연결</text><text class="s" x="644" y="270">numpy 배열: 행 · 열 · 채널</text><text class="s" x="644" y="309">반복 처리: 프레임 읽기와 표시</text><text class="s" x="644" y="348">ROS2 콜백: 메시지가 오면 실행</text></svg>