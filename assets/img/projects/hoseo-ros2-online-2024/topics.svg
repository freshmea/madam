<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640"><rect width="1200" height="640" fill="#f4f1e9"/><style>text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#292524}.large{font-size:44px;font-weight:700}.label{font-size:27px;font-weight:700}.small{font-size:24px}</style><text class="large" x="55" y="85">업무일지에 남은 세 가지 교육 주제</text><rect x="50" y="165" width="350" height="330" rx="14" fill="white"/><rect x="425" y="165" width="350" height="330" rx="14" fill="white"/><rect x="800" y="165" width="350" height="330" rx="14" fill="white"/><text class="large" x="80" y="245" style="fill:#c2410c">01</text><text class="label" x="80" y="325">ROS2 기본 개념</text><text class="small" x="80" y="390">개념과 실습 함께 다루기</text><text class="large" x="455" y="245" style="fill:#c2410c">02</text><text class="label" x="455" y="325">환경 설정</text><text class="small" x="455" y="390">실습을 위한 환경 준비</text><text class="large" x="830" y="245" style="fill:#c2410c">03</text><text class="label" x="830" y="325">노드 작성</text><text class="small" x="830" y="390">프로그램 작성 학습</text><text class="small" x="55" y="570">번호는 내용을 정리하기 위한 구분이며 실제 차시 순서나 시간 배분을 뜻하지 않습니다.</text></svg>