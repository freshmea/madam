<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="코드와 실행 설정을 연결하기"><rect width="1200" height="480" fill="#f4f1eb"/><g font-family="Malgun Gothic,sans-serif"><text x="55" y="75" fill="#c2410c" font-size="32" font-weight="700">코드와 실행 설정을 연결하기</text><rect x="55" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="80" y="198" fill="#211f1b" font-size="28" font-weight="700">파라미터 선언</text><text x="80" y="257" fill="#57534e" font-size="24">max_vel / max_angle</text><rect x="430" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="455" y="198" fill="#211f1b" font-size="28" font-weight="700">YAML 설정</text><text x="455" y="257" fill="#57534e" font-size="24">turtlebotM.yaml</text><rect x="805" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="830" y="198" fill="#211f1b" font-size="28" font-weight="700">변경 콜백</text><text x="830" y="257" fill="#57534e" font-size="24">설정값을 읽어 갱신</text><text x="55" y="383" fill="#211f1b" font-size="25">코드에는 별도의 고정 속도 제한도 함께 남아 있습니다.</text><text x="55" y="432" fill="#78716c" font-size="20">수업 기록과 소스 코드를 바탕으로 재구성한 설명도 · 실행 화면이 아닙니다</text></g></svg>