<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="장치의 입력을 데이터 활용으로 이어 보기"><rect width="1200" height="480" fill="#f4f1eb"/><g font-family="Malgun Gothic,sans-serif"><text x="55" y="75" fill="#c2410c" font-size="32" font-weight="700">장치의 입력을 데이터 활용으로 이어 보기</text><rect x="55" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="80" y="198" fill="#211f1b" font-size="28" font-weight="700">장치 입력</text><text x="80" y="257" fill="#57534e" font-size="23">센서 데이터 생성</text><rect x="430" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="455" y="198" fill="#211f1b" font-size="28" font-weight="700">저장·정리</text><text x="455" y="257" fill="#57534e" font-size="23">데이터베이스 · 표</text><rect x="805" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="830" y="198" fill="#211f1b" font-size="28" font-weight="700">분석·해석</text><text x="830" y="257" fill="#57534e" font-size="23">그래프 · 통계 · 모델</text><text x="55" y="383" fill="#211f1b" font-size="25">수업에서 설명한 전체 흐름이며 완성된 통합 시스템의 실측 결과는 아닙니다.</text><text x="55" y="432" fill="#78716c" font-size="20">수업 기록과 예제 코드를 바탕으로 재구성한 설명도</text></g></svg>