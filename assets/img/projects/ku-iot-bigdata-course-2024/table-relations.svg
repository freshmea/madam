<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="세 테이블을 키로 연결하는 데이터베이스"><rect width="1200" height="480" fill="#f4f1eb"/><g font-family="Malgun Gothic,sans-serif"><text x="55" y="75" fill="#c2410c" font-size="32" font-weight="700">세 테이블을 키로 연결하는 데이터베이스</text><rect x="55" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="80" y="198" fill="#211f1b" font-size="28" font-weight="700">Customer</text><text x="80" y="257" fill="#57534e" font-size="23">custid · 고객 식별</text><rect x="430" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="455" y="198" fill="#211f1b" font-size="28" font-weight="700">Orders</text><text x="455" y="257" fill="#57534e" font-size="23">custid / bookid 참조</text><rect x="805" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="830" y="198" fill="#211f1b" font-size="28" font-weight="700">Book</text><text x="830" y="257" fill="#57534e" font-size="23">bookid · 도서 식별</text><text x="55" y="383" fill="#211f1b" font-size="25">Orders의 외래키로 고객과 도서를 연결하는 예제입니다.</text><text x="55" y="432" fill="#78716c" font-size="20">수업 기록과 예제 코드를 바탕으로 재구성한 설명도</text></g></svg>