<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-label="스크립트에서 재사용 가능한 코드로"><rect width="1200" height="480" fill="#f4f1eb"/><g font-family="Malgun Gothic,sans-serif"><text x="55" y="75" fill="#c2410c" font-size="32" font-weight="700">스크립트에서 재사용 가능한 코드로</text><rect x="55" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="80" y="198" fill="#211f1b" font-size="28" font-weight="700">함수·자료구조</text><text x="80" y="257" fill="#57534e" font-size="23">반복 작업을 묶기</text><rect x="430" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="455" y="198" fill="#211f1b" font-size="28" font-weight="700">클래스·객체</text><text x="455" y="257" fill="#57534e" font-size="23">데이터와 동작을 구성</text><rect x="805" y="140" width="340" height="170" rx="12" fill="white" stroke="#c8c1b6"/><text x="830" y="198" fill="#211f1b" font-size="28" font-weight="700">모듈·파일</text><text x="830" y="257" fill="#57534e" font-size="23">코드 분리 · 저장 · 예외</text><text x="55" y="383" fill="#211f1b" font-size="25">5월 21~24일 Python 기초 실습에서 다룬 구성입니다.</text><text x="55" y="432" fill="#78716c" font-size="20">수업 기록과 예제 코드를 바탕으로 재구성한 설명도</text></g></svg>