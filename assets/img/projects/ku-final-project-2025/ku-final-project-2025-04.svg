<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">관절 좌표에서 피드백과 기록으로</title><desc id="desc">자세 피드백 사례. 영상 수신 / ESP32-CAM / 프레임 입력; 좌표 / 계산 / MediaPipe · 각도 / 규칙에 따른 상태 판단; 안내 / 웹 표시 · 음성 / 사용자 피드백; 기록 / SQLite 이력 / 상태 변화의 저장</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">관절 좌표에서 피드백과 기록으로</text><text x="56" y="151" font-size="23" fill="#57534e">자세 피드백 사례</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">영상 수신</text><text x="84" y="294" font-size="25" fill="#44403c">ESP32-CAM</text><text x="84" y="338" font-size="22" fill="#78716c">프레임 입력</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">좌표 / 계산</text><text x="646" y="294" font-size="25" fill="#44403c">MediaPipe · 각도</text><text x="646" y="338" font-size="22" fill="#78716c">규칙에 따른 상태 판단</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">안내</text><text x="84" y="499" font-size="25" fill="#44403c">웹 표시 · 음성</text><text x="84" y="543" font-size="22" fill="#78716c">사용자 피드백</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">기록</text><text x="646" y="499" font-size="25" fill="#44403c">SQLite 이력</text><text x="646" y="543" font-size="22" fill="#78716c">상태 변화의 저장</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">의료적 진단·치료 결과가 아닌 교육용 영상 분석 구조입니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>