<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">모델의 결과가 서비스의 동작이 되기까지</title><desc id="desc">최종 프로젝트에서 연결한 기능. 입력 / 카메라 · 업로드 이미지 / 유효한 데이터 준비; 처리 / 검출 · 좌표 · 합성 / 사례별 모델과 로직; 연결 / 서버 · 통신 · DB / 결과 전달과 기록; 피드백 / 웹 화면 · 장치 알림 / 사용자에게 결과 제공</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">모델의 결과가 서비스의 동작이 되기까지</text><text x="56" y="151" font-size="23" fill="#57534e">최종 프로젝트에서 연결한 기능</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">입력</text><text x="84" y="294" font-size="25" fill="#44403c">카메라 · 업로드 이미지</text><text x="84" y="338" font-size="22" fill="#78716c">유효한 데이터 준비</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">처리</text><text x="646" y="294" font-size="25" fill="#44403c">검출 · 좌표 · 합성</text><text x="646" y="338" font-size="22" fill="#78716c">사례별 모델과 로직</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">연결</text><text x="84" y="499" font-size="25" fill="#44403c">서버 · 통신 · DB</text><text x="84" y="543" font-size="22" fill="#78716c">결과 전달과 기록</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">피드백</text><text x="646" y="499" font-size="25" fill="#44403c">웹 화면 · 장치 알림</text><text x="646" y="543" font-size="22" fill="#78716c">사용자에게 결과 제공</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">실제 인물·시연 화면 대신 제출 문서의 처리 구조를 재구성했습니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>