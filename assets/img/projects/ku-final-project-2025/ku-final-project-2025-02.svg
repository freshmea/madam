<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">영상의 판단을 장치 알림으로</title><desc id="desc">현장 모니터링 사례. 영상 / 카메라 프레임 / 입력과 처리 환경; 분석 / 사람·안전모·영역 / 검출과 조건 판단; 이벤트 / 저장 · 웹 상태 / 상황을 기록하고 확인; 장치 / TCP → ESP8266 / LED · 부저로 알림</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">영상의 판단을 장치 알림으로</text><text x="56" y="151" font-size="23" fill="#57534e">현장 모니터링 사례</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">영상</text><text x="84" y="294" font-size="25" fill="#44403c">카메라 프레임</text><text x="84" y="338" font-size="22" fill="#78716c">입력과 처리 환경</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">분석</text><text x="646" y="294" font-size="25" fill="#44403c">사람·안전모·영역</text><text x="646" y="338" font-size="22" fill="#78716c">검출과 조건 판단</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">이벤트</text><text x="84" y="499" font-size="25" fill="#44403c">저장 · 웹 상태</text><text x="84" y="543" font-size="22" fill="#78716c">상황을 기록하고 확인</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">장치</text><text x="646" y="499" font-size="25" fill="#44403c">TCP → ESP8266</text><text x="646" y="543" font-size="22" fill="#78716c">LED · 부저로 알림</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">교육용 구현 구조이며 사고 예방 효과나 안전 인증을 입증하지 않습니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>