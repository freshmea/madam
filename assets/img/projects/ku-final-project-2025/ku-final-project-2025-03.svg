<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">이미지를 받고 결과 이미지를 돌려주기</title><desc id="desc">가상 시착 사례. 업로드 / 인물·의류 이미지 / 입력 파일 준비; 전처리 / 키포인트와 입력 형태 / 모델 입력 구성; 모델 처리 / 의류 합성 / 결과 이미지 생성; 응답 / Flask와 웹 화면 / 결과 파일 표시</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">이미지를 받고 결과 이미지를 돌려주기</text><text x="56" y="151" font-size="23" fill="#57534e">가상 시착 사례</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">업로드</text><text x="84" y="294" font-size="25" fill="#44403c">인물·의류 이미지</text><text x="84" y="338" font-size="22" fill="#78716c">입력 파일 준비</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">전처리</text><text x="646" y="294" font-size="25" fill="#44403c">키포인트와 입력 형태</text><text x="646" y="338" font-size="22" fill="#78716c">모델 입력 구성</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">모델 처리</text><text x="84" y="499" font-size="25" fill="#44403c">의류 합성</text><text x="84" y="543" font-size="22" fill="#78716c">결과 이미지 생성</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">응답</text><text x="646" y="499" font-size="25" fill="#44403c">Flask와 웹 화면</text><text x="646" y="543" font-size="22" fill="#78716c">결과 파일 표시</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">원본 인물 사진은 사용하지 않았으며 실제 착용감·치수 검증을 뜻하지 않습니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>