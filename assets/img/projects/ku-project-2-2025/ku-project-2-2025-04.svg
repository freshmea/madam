<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">인증과 착석, 모드 선택을 구분하기</title><desc id="desc">학습 루틴 사례의 상태 조건. 등록 확인 / RFID 인증 / 시작 가능한 사용자 조건; 착석 확인 / FSR 입력 / 진행과 중단 조건; 사용자 선택 / 터치 입력 / 표시 모드 전환; 피드백 / 기록 / LED · LCD · MySQL / 상태와 시간 기록</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">인증과 착석, 모드 선택을 구분하기</text><text x="56" y="151" font-size="23" fill="#57534e">학습 루틴 사례의 상태 조건</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">등록 확인</text><text x="84" y="294" font-size="25" fill="#44403c">RFID 인증</text><text x="84" y="338" font-size="22" fill="#78716c">시작 가능한 사용자 조건</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">착석 확인</text><text x="646" y="294" font-size="25" fill="#44403c">FSR 입력</text><text x="646" y="338" font-size="22" fill="#78716c">진행과 중단 조건</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">사용자 선택</text><text x="84" y="499" font-size="25" fill="#44403c">터치 입력</text><text x="84" y="543" font-size="22" fill="#78716c">표시 모드 전환</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">피드백 / 기록</text><text x="646" y="499" font-size="25" fill="#44403c">LED · LCD · MySQL</text><text x="646" y="543" font-size="22" fill="#78716c">상태와 시간 기록</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">개인의 인증 값·학습 시간은 포함하지 않았으며 ZeroMQ 완성을 뜻하지 않습니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>