<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">이동하는 모형과 주차 공간 연결</title><desc id="desc">주차 시스템 기술서의 구성. RC카 / 라인 감지 · 장애물 정지 / 모형의 주행 상태; 주차 공간 / 공간 센서 · RFID / 입출차와 자리 상태; 서버 / 저장 / TCP · ZMQ · MySQL / 상태 판단과 로그; 표시 / LED · Tkinter / 주차 현황 안내</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">이동하는 모형과 주차 공간 연결</text><text x="56" y="151" font-size="23" fill="#57534e">주차 시스템 기술서의 구성</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">RC카</text><text x="84" y="294" font-size="25" fill="#44403c">라인 감지 · 장애물 정지</text><text x="84" y="338" font-size="22" fill="#78716c">모형의 주행 상태</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">주차 공간</text><text x="646" y="294" font-size="25" fill="#44403c">공간 센서 · RFID</text><text x="646" y="338" font-size="22" fill="#78716c">입출차와 자리 상태</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">서버 / 저장</text><text x="84" y="499" font-size="25" fill="#44403c">TCP · ZMQ · MySQL</text><text x="84" y="543" font-size="22" fill="#78716c">상태 판단과 로그</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">표시</text><text x="646" y="499" font-size="25" fill="#44403c">LED · Tkinter</text><text x="646" y="543" font-size="22" fill="#78716c">주차 현황 안내</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">도로 자율주행이나 상용 관제 성능을 검증한 자료가 아닙니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>