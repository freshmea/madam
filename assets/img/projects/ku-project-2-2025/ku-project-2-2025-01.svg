<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">서로 다른 프로그램이 같은 상태를 보려면</title><desc id="desc">두 번째 프로젝트의 공통 연결. 장치 / 센서 · 버튼 · 움직임 / 입력 이벤트 수집; 메시지 / TCP · 사례별 IPC / 입력과 요청 전달; 서버 / 상태와 규칙 처리 / 기록 또는 제어 결정; 결과 / GUI · LED · LCD / 사용자에게 상태 전달</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">서로 다른 프로그램이 같은 상태를 보려면</text><text x="56" y="151" font-size="23" fill="#57534e">두 번째 프로젝트의 공통 연결</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">장치</text><text x="84" y="294" font-size="25" fill="#44403c">센서 · 버튼 · 움직임</text><text x="84" y="338" font-size="22" fill="#78716c">입력 이벤트 수집</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">메시지</text><text x="646" y="294" font-size="25" fill="#44403c">TCP · 사례별 IPC</text><text x="646" y="338" font-size="22" fill="#78716c">입력과 요청 전달</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">서버</text><text x="84" y="499" font-size="25" fill="#44403c">상태와 규칙 처리</text><text x="84" y="543" font-size="22" fill="#78716c">기록 또는 제어 결정</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">결과</text><text x="646" y="499" font-size="25" fill="#44403c">GUI · LED · LCD</text><text x="646" y="543" font-size="22" fill="#78716c">사용자에게 상태 전달</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">사례마다 언어·DB·IPC 구현 범위가 다르며 하나의 공통 완성품이 아닙니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>