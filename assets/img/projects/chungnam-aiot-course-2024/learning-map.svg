<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">충남 AIoT 교육의 학습 흐름</title><desc id="desc">Python 기초에서 OpenCV, ROS2 통신, 로봇 주행과 주변 장치로 확장하는 수업 기록 요약도</desc><rect width="1200" height="760" fill="#f1efeb"/><path d="M70 220H1130 M70 670H1130" stroke="#211f1b"/><g font-family="Malgun Gothic, sans-serif"><text x="70" y="95" fill="#c5470a" font-size="22" letter-spacing="4">CHUNGNAM / AIoT 2024</text><text x="70" y="161" fill="#211f1b" font-size="46" font-weight="700">코드가 로봇의 동작이 되기까지</text><text x="70" y="275" fill="#c5470a" font-size="24">01</text><text x="140" y="275" fill="#211f1b" font-size="28" font-weight="700">Python</text><text x="460" y="275" fill="#49463f" font-size="24">기초 문법 · 클래스</text><text x="910" y="275" fill="#49463f" font-size="22">09.19–09.24</text><text x="70" y="351" fill="#c5470a" font-size="24">02</text><text x="140" y="351" fill="#211f1b" font-size="28" font-weight="700">OpenCV</text><text x="460" y="351" fill="#49463f" font-size="24">영상 처리 · 마커</text><text x="910" y="351" fill="#49463f" font-size="22">10.14–10.17</text><text x="70" y="427" fill="#c5470a" font-size="24">03</text><text x="140" y="427" fill="#211f1b" font-size="28" font-weight="700">ROS2</text><text x="460" y="427" fill="#49463f" font-size="24">노드 · 통신 · 좌표</text><text x="910" y="427" fill="#49463f" font-size="22">10.17–11.07</text><text x="70" y="503" fill="#c5470a" font-size="24">04</text><text x="140" y="503" fill="#211f1b" font-size="28" font-weight="700">Navigation</text><text x="460" y="503" fill="#49463f" font-size="24">지도 · 경로 · 이동</text><text x="910" y="503" fill="#49463f" font-size="22">11.05–11.08</text><text x="70" y="579" fill="#c5470a" font-size="24">05</text><text x="140" y="579" fill="#211f1b" font-size="28" font-weight="700">Hardware</text><text x="460" y="579" fill="#49463f" font-size="24">센서 · MCU · 로봇팔</text><text x="910" y="579" fill="#49463f" font-size="22">11.11–11.21</text><text x="70" y="715" fill="#625e57" font-size="20">날짜별 수업 기록을 묶은 요약 · 프로젝트는 11월 25일부터</text></g></svg>