<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="480" viewBox="0 0 1200 480" role="img" aria-labelledby="t d"><title id="t">ROS2 발행과 구독의 연결</title><desc id="d">발행 노드가 토픽에 메시지를 보내면 구독 노드의 콜백이 처리합니다.</desc><rect width="1200" height="480" fill="#f5f3ef"/><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0 0L8 3L0 6" fill="none" stroke="#c2410c" stroke-width="2"/></marker></defs><g font-family="Malgun Gothic,sans-serif"><text x="65" y="70" font-size="23" fill="#c2410c">ROS2 / 메시지가 이동하는 구조</text><g fill="white" stroke="#bdb7ad"><rect x="65" y="140" width="280" height="160" rx="12"/><rect x="460" y="140" width="280" height="160" rx="12"/><rect x="855" y="140" width="280" height="160" rx="12"/></g><g stroke="#c2410c" stroke-width="3" marker-end="url(#arrow)"><path d="M355 220H445"/><path d="M750 220H840"/></g><g text-anchor="middle" fill="#24211d" font-size="30" font-weight="700"><text x="205" y="205">발행 노드</text><text x="600" y="205">토픽</text><text x="995" y="205">구독 노드</text></g><g text-anchor="middle" fill="#57534e" font-size="23"><text x="205" y="260">메시지 생성·전송</text><text x="600" y="260">이름과 메시지 형식</text><text x="995" y="260">콜백 함수로 처리</text></g><text x="65" y="365" font-size="25" fill="#24211d">한 노드의 출력이 다른 노드의 입력으로 이어집니다.</text><text x="65" y="416" font-size="21" fill="#57534e">10월 18~21일 발행자·구독자 실습을 설명하기 위해 재구성한 개념도</text></g></svg>