<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">파일만으로는 실행 환경을 설명할 수 없다</title><desc id="desc">가상환경과 컨테이너의 역할을 구분하기. 소스 / Python 코드와 설정 / 실행할 기능 정의; 가상환경 / Python 패키지 환경 / 인터프리터와 의존성 확인; 컨테이너 / Dockerfile · Compose / 실행 환경 구성; 실행 확인 / PATH · 로그 · 동작 / 설정한 환경에서 확인</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">파일만으로는 실행 환경을 설명할 수 없다</text><text x="56" y="151" font-size="23" fill="#57534e">가상환경과 컨테이너의 역할을 구분하기</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">소스</text><text x="84" y="294" font-size="25" fill="#44403c">Python 코드와 설정</text><text x="84" y="338" font-size="22" fill="#78716c">실행할 기능 정의</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">가상환경</text><text x="646" y="294" font-size="25" fill="#44403c">Python 패키지 환경</text><text x="646" y="338" font-size="22" fill="#78716c">인터프리터와 의존성 확인</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">컨테이너</text><text x="84" y="499" font-size="25" fill="#44403c">Dockerfile · Compose</text><text x="84" y="543" font-size="22" fill="#78716c">실행 환경 구성</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">실행 확인</text><text x="646" y="499" font-size="25" fill="#44403c">PATH · 로그 · 동작</text><text x="646" y="543" font-size="22" fill="#78716c">설정한 환경에서 확인</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">가상환경과 컨테이너를 같은 격리 수준으로 표현한 그림이 아닙니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>