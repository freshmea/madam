<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">언어에서 실행 환경으로</title><desc id="desc">7일 동안 확장한 Python 프로그램의 범위. 문법과 데이터 / 문자열 · 리스트 · 사전 / 입력을 처리하는 첫 코드; 기능 구성 / 함수 · 파일 · 클래스 / 데이터와 동작을 나누기; 실행 환경 / 패키지 · 가상환경 / 의존성과 실행 경로 확인; 응용 / C 확장 · Flask · Pygame / 여러 기능을 하나로 연결</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">언어에서 실행 환경으로</text><text x="56" y="151" font-size="23" fill="#57534e">7일 동안 확장한 Python 프로그램의 범위</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">문법과 데이터</text><text x="84" y="294" font-size="25" fill="#44403c">문자열 · 리스트 · 사전</text><text x="84" y="338" font-size="22" fill="#78716c">입력을 처리하는 첫 코드</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">기능 구성</text><text x="646" y="294" font-size="25" fill="#44403c">함수 · 파일 · 클래스</text><text x="646" y="338" font-size="22" fill="#78716c">데이터와 동작을 나누기</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">실행 환경</text><text x="84" y="499" font-size="25" fill="#44403c">패키지 · 가상환경</text><text x="84" y="543" font-size="22" fill="#78716c">의존성과 실행 경로 확인</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">응용</text><text x="646" y="499" font-size="25" fill="#44403c">C 확장 · Flask · Pygame</text><text x="646" y="543" font-size="22" fill="#78716c">여러 기능을 하나로 연결</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">실제 과제 화면이 아닌 수업 흐름을 정리한 설명용 도해입니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>