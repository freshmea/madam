<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">작은 게임의 반복 흐름</title><desc id="desc">Game 클래스에서 확인되는 역할 분리. 입력 / 키보드 · 마우스 · 종료 / 이벤트 확인; 갱신 / Ball · UI · 상태 / update 호출; 그리기 / 화면 지우기 · 출력 / draw와 display 갱신; 반복 / 프레임 제어와 종료 / 다음 입력을 기다리기</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">작은 게임의 반복 흐름</text><text x="56" y="151" font-size="23" fill="#57534e">Game 클래스에서 확인되는 역할 분리</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">입력</text><text x="84" y="294" font-size="25" fill="#44403c">키보드 · 마우스 · 종료</text><text x="84" y="338" font-size="22" fill="#78716c">이벤트 확인</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">갱신</text><text x="646" y="294" font-size="25" fill="#44403c">Ball · UI · 상태</text><text x="646" y="338" font-size="22" fill="#78716c">update 호출</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">그리기</text><text x="84" y="499" font-size="25" fill="#44403c">화면 지우기 · 출력</text><text x="84" y="543" font-size="22" fill="#78716c">draw와 display 갱신</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">반복</text><text x="646" y="499" font-size="25" fill="#44403c">프레임 제어와 종료</text><text x="646" y="543" font-size="22" fill="#78716c">다음 입력을 기다리기</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">강사 예제의 구조이며 실제 게임 캡처나 측정 FPS가 아닙니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>