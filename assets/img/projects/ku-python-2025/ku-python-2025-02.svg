<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">다른 파일과 다른 언어의 기능을 사용하기</title><desc id="desc">모듈과 C 확장의 연결 관계. Python 코드 / import와 함수 호출 / 사용하는 쪽의 인터페이스; 모듈 / 패키지 / 기능을 파일로 분리 / 설치와 검색 경로; C 확장 코드 / mymodule.c / Python API를 통한 연결; 빌드 / 설치 / setup.py 등 실습 / 환경에 맞는 모듈 준비</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">다른 파일과 다른 언어의 기능을 사용하기</text><text x="56" y="151" font-size="23" fill="#57534e">모듈과 C 확장의 연결 관계</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">Python 코드</text><text x="84" y="294" font-size="25" fill="#44403c">import와 함수 호출</text><text x="84" y="338" font-size="22" fill="#78716c">사용하는 쪽의 인터페이스</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">모듈 / 패키지</text><text x="646" y="294" font-size="25" fill="#44403c">기능을 파일로 분리</text><text x="646" y="338" font-size="22" fill="#78716c">설치와 검색 경로</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">C 확장 코드</text><text x="84" y="499" font-size="25" fill="#44403c">mymodule.c</text><text x="84" y="543" font-size="22" fill="#78716c">Python API를 통한 연결</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">빌드 / 설치</text><text x="646" y="499" font-size="25" fill="#44403c">setup.py 등 실습</text><text x="646" y="543" font-size="22" fill="#78716c">환경에 맞는 모듈 준비</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">모듈과 C 확장을 비교한 그림이며 모든 모듈이 C 확장을 거치는 것은 아닙니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>