<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">ROS2 교육의 다섯 단계</title><desc id="desc">영상 처리, 노드 통신, 로봇 연결, 센서 제어, 지도와 목적지 이동으로 이어지는 수업 흐름</desc><rect width="1200" height="760" fill="#f1efeb"/><path d="M70 220H1130 M70 670H1130" stroke="#211f1b"/><g font-family="Malgun Gothic, sans-serif"><text x="70" y="95" fill="#c5470a" font-size="22" letter-spacing="4">KDTA / ROS2 EDUCATION 2024</text><text x="70" y="161" fill="#211f1b" font-size="46" font-weight="700">영상 입력에서 목적지 이동까지</text><text x="70" y="275" fill="#c5470a" font-size="24">01</text><text x="140" y="275" fill="#211f1b" font-size="28" font-weight="700">OpenCV</text><text x="460" y="275" fill="#49463f" font-size="24">영상 · 이벤트</text><text x="910" y="275" fill="#49463f" font-size="22">07.23–07.26</text><text x="70" y="351" fill="#c5470a" font-size="24">02</text><text x="140" y="351" fill="#211f1b" font-size="28" font-weight="700">ROS2</text><text x="460" y="351" fill="#49463f" font-size="24">노드 · 토픽</text><text x="910" y="351" fill="#49463f" font-size="22">07.30–07.31</text><text x="70" y="427" fill="#c5470a" font-size="24">03</text><text x="140" y="427" fill="#211f1b" font-size="28" font-weight="700">TurtleBot3</text><text x="460" y="427" fill="#49463f" font-size="24">기체 · 서비스 · 액션</text><text x="910" y="427" fill="#49463f" font-size="22">08.01–08.06</text><text x="70" y="503" fill="#c5470a" font-size="24">04</text><text x="140" y="503" fill="#211f1b" font-size="28" font-weight="700">Sensors</text><text x="460" y="503" fill="#49463f" font-size="24">카메라 · 라이다</text><text x="910" y="503" fill="#49463f" font-size="22">08.07–08.08</text><text x="70" y="579" fill="#c5470a" font-size="24">05</text><text x="140" y="579" fill="#211f1b" font-size="28" font-weight="700">Navigation</text><text x="460" y="579" fill="#49463f" font-size="24">지도 · 목적지 순회</text><text x="910" y="579" fill="#49463f" font-size="22">08.09–08.12</text><text x="70" y="715" fill="#625e57" font-size="20">2024년 7월 23일~8월 12일 수업 기록을 재구성한 요약도</text></g></svg>