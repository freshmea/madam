<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t"><title id="t">화면은 요청하고 Python이 파일 정보를 읽는다</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><rect width="1200" height="680" rx="20" fill="#faf7f1"/><g font-family="Malgun Gothic,sans-serif" fill="#292524"><text x="50" y="60" font-size="29" font-weight="700">화면은 요청하고 Python이 파일 정보를 읽는다</text><rect x="55" y="150" width="330" height="145" rx="14" fill="#dbeafe" stroke="#d6d3d1"/><text x="220.0" y="188" text-anchor="middle" font-size="22">HTML / JavaScript</text><text x="220.0" y="223" text-anchor="middle" font-size="22">버튼 이벤트</text><text x="220.0" y="258" text-anchor="middle" font-size="22">pywebview.api.list_files()</text><rect x="485" y="150" width="660" height="145" rx="14" fill="#dcfce7" stroke="#d6d3d1"/><text x="815.0" y="188" text-anchor="middle" font-size="22">Python · FileListApi</text><text x="815.0" y="223" text-anchor="middle" font-size="22">demo_files 폴더에서 파일만 선택</text><text x="815.0" y="258" text-anchor="middle" font-size="22">이름 · 확장자 · 크기를 목록으로 반환</text><path d="M395 210L475 210" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><path d="M795 310L795 410" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><rect x="75" y="425" width="1050" height="130" rx="14" fill="#fff" stroke="#d6d3d1"/><text x="600.0" y="463" text-anchor="middle" font-size="22">반환한 목록 → Promise 결과 → 화면의 목록 갱신</text><text x="600.0" y="498" text-anchor="middle" font-size="22">HTTP URL을 거치지 않고 노출한 Python 메서드를 호출하는 경로</text><text x="65" y="620" font-size="22">타이머의 fetch 경로와 파일 목록의 API 브리지 경로를 구분해 읽습니다.</text></g></svg>