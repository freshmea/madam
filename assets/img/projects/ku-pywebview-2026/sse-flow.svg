<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" role="img" aria-labelledby="t"><title id="t">같은 상태를 공유하고 변경을 알리는 카운터</title><defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><rect width="1200" height="680" rx="20" fill="#faf7f1"/><g font-family="Malgun Gothic,sans-serif" fill="#292524"><text x="50" y="60" font-size="29" font-weight="700">같은 상태를 공유하고 변경을 알리는 카운터</text><rect x="55" y="135" width="300" height="110" rx="14" fill="#dbeafe" stroke="#d6d3d1"/><text x="205.0" y="173" text-anchor="middle" font-size="22">창 A · 버튼 클릭</text><text x="205.0" y="208" text-anchor="middle" font-size="22">화면의 값: 2</text><rect x="440" y="275" width="320" height="150" rx="14" fill="#ffedd5" stroke="#d6d3d1"/><text x="600.0" y="313" text-anchor="middle" font-size="22">Python 서버</text><text x="600.0" y="348" text-anchor="middle" font-size="22">공유 count: 2</text><text x="600.0" y="383" text-anchor="middle" font-size="22">Lock + 구독자 Queue</text><rect x="845" y="135" width="300" height="110" rx="14" fill="#dcfce7" stroke="#d6d3d1"/><text x="995.0" y="173" text-anchor="middle" font-size="22">창 B · 버튼 조작 없음</text><text x="995.0" y="208" text-anchor="middle" font-size="22">SSE 수신 후 값: 2</text><path d="M230 255L470 275" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><path d="M740 275L980 255" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><path d="M450 390L180 390" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><path d="M750 390L1020 390" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><text x="55" y="300" font-size="21">POST · 증가 요청</text><text x="835" y="300" font-size="21">변경된 상태 알림</text><path d="M180 390V255M1020 390V255" stroke="#c2410c" stroke-width="4" marker-end="url(#a)" fill="none"/><text x="65" y="480" font-size="24">명령 요청: 브라우저 → 서버의 HTTP API</text><text x="65" y="530" font-size="24">변경 알림: 서버 → 연결된 화면들의 SSE 스트림</text><text x="65" y="600" font-size="21">값을 공유하는 것과 각 창의 화면을 갱신하는 것은 별도의 일입니다.</text></g></svg>