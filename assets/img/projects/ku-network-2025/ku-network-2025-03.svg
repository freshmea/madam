<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">여러 연결을 처리하는 세 가지 관점</title><desc id="desc">프로세스 · 이벤트 · 스레드. fork / 연결 처리를 자식에게 / 종료된 프로세스 정리; select / epoll / 준비된 입출력 확인 / 등록·대기·처리·해제; thread / 실행 흐름을 나누기 / 인자 수명과 공유 상태; 공통 점검 / 접속 · 오류 · 연결 종료 / 자원을 언제 정리할까?</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">여러 연결을 처리하는 세 가지 관점</text><text x="56" y="151" font-size="23" fill="#57534e">프로세스 · 이벤트 · 스레드</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">fork</text><text x="84" y="294" font-size="25" fill="#44403c">연결 처리를 자식에게</text><text x="84" y="338" font-size="22" fill="#78716c">종료된 프로세스 정리</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">select / epoll</text><text x="646" y="294" font-size="25" fill="#44403c">준비된 입출력 확인</text><text x="646" y="338" font-size="22" fill="#78716c">등록·대기·처리·해제</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">thread</text><text x="84" y="499" font-size="25" fill="#44403c">실행 흐름을 나누기</text><text x="84" y="543" font-size="22" fill="#78716c">인자 수명과 공유 상태</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">공통 점검</text><text x="646" y="499" font-size="25" fill="#44403c">접속 · 오류 · 연결 종료</text><text x="646" y="543" font-size="22" fill="#78716c">자원을 언제 정리할까?</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">성능 순위가 아닌 수업에서 비교한 처리 구조를 나타냅니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>