<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">보낸 데이터와 읽은 데이터의 경계</title><desc id="desc">ABCDEFGH를 쓰고 ABC와 DEFGH로 나눠 읽는 가상의 예. 누적 길이를 관리한다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><rect width="1200" height="650" rx="20" fill="#faf7f1"/><g font-family="Malgun Gothic, sans-serif" fill="#292524"><text x="55" y="65" font-size="30" font-weight="700">보낸 데이터와 읽은 데이터의 경계</text><text x="55" y="120" font-size="21">송신 프로그램 · 8바이트를 한 번에 쓰는 예</text><rect x="70" y="150" width="112" height="72" rx="10" fill="#ffedd5" stroke="#a8a29e"/><text x="126.0" y="194.0" text-anchor="middle" font-size="23">A</text><rect x="195" y="150" width="112" height="72" rx="10" fill="#ffedd5" stroke="#a8a29e"/><text x="251.0" y="194.0" text-anchor="middle" font-size="23">B</text><rect x="320" y="150" width="112" height="72" rx="10" fill="#ffedd5" stroke="#a8a29e"/><text x="376.0" y="194.0" text-anchor="middle" font-size="23">C</text><rect x="445" y="150" width="112" height="72" rx="10" fill="#ffedd5" stroke="#a8a29e"/><text x="501.0" y="194.0" text-anchor="middle" font-size="23">D</text><rect x="570" y="150" width="112" height="72" rx="10" fill="#ffedd5" stroke="#a8a29e"/><text x="626.0" y="194.0" text-anchor="middle" font-size="23">E</text><rect x="695" y="150" width="112" height="72" rx="10" fill="#ffedd5" stroke="#a8a29e"/><text x="751.0" y="194.0" text-anchor="middle" font-size="23">F</text><rect x="820" y="150" width="112" height="72" rx="10" fill="#ffedd5" stroke="#a8a29e"/><text x="876.0" y="194.0" text-anchor="middle" font-size="23">G</text><rect x="945" y="150" width="112" height="72" rx="10" fill="#ffedd5" stroke="#a8a29e"/><text x="1001.0" y="194.0" text-anchor="middle" font-size="23">H</text><path d="M600 240L600 295" stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="55" y="340" font-size="21">수신 프로그램 · 3바이트와 5바이트로 나누어 읽을 수도 있음</text><rect x="70" y="370" width="360" height="80" rx="10" fill="#dbeafe" stroke="#a8a29e"/><text x="250.0" y="418.0" text-anchor="middle" font-size="23">read 1 → ABC</text><rect x="460" y="370" width="610" height="80" rx="10" fill="#dcfce7" stroke="#a8a29e"/><text x="765.0" y="418.0" text-anchor="middle" font-size="23">read 2 → DEFGH</text><text x="70" y="505" font-size="23">누적 길이 3 → 다음 저장 위치 buffer + 3 → 누적 길이 8</text><text x="70" y="554" font-size="21">그림의 경계는 read 호출의 예시이며, TCP 패킷 경계를 뜻하지 않습니다.</text><text x="70" y="598" font-size="21">애플리케이션이 길이·구분자 등으로 메시지의 끝을 정해야 합니다.</text></g></svg>