<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">프로그램 사이로 데이터를 보내기</title><desc id="desc">한 컴퓨터의 프로세스에서 네트워크의 서버·클라이언트로. IPC / 공유메모리 · 파이프 / 프로세스 사이의 전달; SOCKET / TCP · UDP / 주소와 포트로 연결; I/O / 읽기 · 쓰기 · 종료 / 연결과 데이터 상태 확인; CONCURRENCY / select · epoll · thread / 여러 연결을 다루는 구조</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">프로그램 사이로 데이터를 보내기</text><text x="56" y="151" font-size="23" fill="#57534e">한 컴퓨터의 프로세스에서 네트워크의 서버·클라이언트로</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">IPC</text><text x="84" y="294" font-size="25" fill="#44403c">공유메모리 · 파이프</text><text x="84" y="338" font-size="22" fill="#78716c">프로세스 사이의 전달</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">SOCKET</text><text x="646" y="294" font-size="25" fill="#44403c">TCP · UDP</text><text x="646" y="338" font-size="22" fill="#78716c">주소와 포트로 연결</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">I/O</text><text x="84" y="499" font-size="25" fill="#44403c">읽기 · 쓰기 · 종료</text><text x="84" y="543" font-size="22" fill="#78716c">연결과 데이터 상태 확인</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">CONCURRENCY</text><text x="646" y="499" font-size="25" fill="#44403c">select · epoll · thread</text><text x="646" y="543" font-size="22" fill="#78716c">여러 연결을 다루는 구조</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">각 방식의 구현 범위는 날짜별 수업 기록을 기준으로 구분합니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>