<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">파일을 다 보낸 뒤에도 응답을 받을 수 있다</title><desc id="desc">서버에서 파일 전송 후 송신 방향을 종료하고 클라이언트 응답을 읽는 순서</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><rect width="1200" height="650" rx="20" fill="#faf7f1"/><g font-family="Malgun Gothic, sans-serif" fill="#292524"><text x="55" y="65" font-size="30" font-weight="700">파일을 다 보낸 뒤에도 응답을 받을 수 있다</text><rect x="95" y="100" width="310" height="65" rx="10" fill="#ffedd5" stroke="#a8a29e"/><text x="250.0" y="140.5" text-anchor="middle" font-size="23">파일 전송 서버</text><rect x="785" y="100" width="310" height="65" rx="10" fill="#dbeafe" stroke="#a8a29e"/><text x="940.0" y="140.5" text-anchor="middle" font-size="23">파일 수신 클라이언트</text><path d="M250 180V580M940 180V580" stroke="#a8a29e" stroke-width="3" stroke-dasharray="8 8"/><path d="M250 235L940 235" stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="595" y="215" text-anchor="middle" font-size="22">파일 내용 전송</text><path d="M250 340L940 340" stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="595" y="320" text-anchor="middle" font-size="22">shutdown(SHUT_WR) · 송신 방향 종료</text><path d="M940 460L250 460" stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><text x="595" y="440" text-anchor="middle" font-size="22">수신 완료 응답 · 반대 방향은 유지</text><text x="250" y="565" text-anchor="middle" font-size="23">응답을 읽은 뒤 close</text><text x="940" y="565" text-anchor="middle" font-size="23">파일 끝 확인 후 응답</text><text x="65" y="620" font-size="20">한쪽 전송의 끝과 연결 전체의 종료는 다릅니다. 실제 패킷 캡처가 아닌 동작 설명입니다.</text></g></svg>