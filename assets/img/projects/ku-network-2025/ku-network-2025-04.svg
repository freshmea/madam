<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">통신 프로그램을 점검하는 순서</title><desc id="desc">코드와 실행 환경을 함께 읽기. 실행 / 빌드와 프로세스 확인 / 프로그램이 시작됐는가; 연결 / 주소 · 포트 · 대기 상태 / 상대가 접속 가능한가; 데이터 / 읽은 길이 · 버퍼 상태 / 원하는 내용이 왔는가; 종료 / 오류 · 해제 · 자원 정리 / 다음 연결도 처리 가능한가</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">통신 프로그램을 점검하는 순서</text><text x="56" y="151" font-size="23" fill="#57534e">코드와 실행 환경을 함께 읽기</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">실행</text><text x="84" y="294" font-size="25" fill="#44403c">빌드와 프로세스 확인</text><text x="84" y="338" font-size="22" fill="#78716c">프로그램이 시작됐는가</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">연결</text><text x="646" y="294" font-size="25" fill="#44403c">주소 · 포트 · 대기 상태</text><text x="646" y="338" font-size="22" fill="#78716c">상대가 접속 가능한가</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">데이터</text><text x="84" y="499" font-size="25" fill="#44403c">읽은 길이 · 버퍼 상태</text><text x="84" y="543" font-size="22" fill="#78716c">원하는 내용이 왔는가</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">종료</text><text x="646" y="499" font-size="25" fill="#44403c">오류 · 해제 · 자원 정리</text><text x="646" y="543" font-size="22" fill="#78716c">다음 연결도 처리 가능한가</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">실제 수업에서 수신 불일치와 fd 설정을 점검한 흐름을 재구성했습니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>