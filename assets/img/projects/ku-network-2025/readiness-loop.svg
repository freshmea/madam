<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc"><title id="title">여러 연결 중 준비된 입력부터 처리하기</title><desc id="desc">A B C 연결 중 B가 읽기 준비됨. 이벤트 루프가 B 처리 후 대기로 돌아간다.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10Z" fill="#c2410c"/></marker></defs><rect width="1200" height="650" rx="20" fill="#faf7f1"/><g font-family="Malgun Gothic, sans-serif" fill="#292524"><text x="55" y="65" font-size="30" font-weight="700">여러 연결 중 준비된 입력부터 처리하기</text><rect x="55" y="135" width="330" height="90" rx="10" fill="#e7e5e4" stroke="#a8a29e"/><text x="220.0" y="188.0" text-anchor="middle" font-size="23">연결 A · 입력 없음</text><path d="M395 180L515 315" stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="55" y="270" width="330" height="90" rx="10" fill="#dcfce7" stroke="#a8a29e"/><text x="220.0" y="323.0" text-anchor="middle" font-size="23">연결 B · 읽기 준비</text><path d="M395 315L515 315" stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="55" y="405" width="330" height="90" rx="10" fill="#e7e5e4" stroke="#a8a29e"/><text x="220.0" y="458.0" text-anchor="middle" font-size="23">연결 C · 입력 없음</text><path d="M395 450L515 315" stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="535" y="255" width="260" height="120" rx="10" fill="#dbeafe" stroke="#a8a29e"/><text x="665.0" y="323.0" text-anchor="middle" font-size="23">select / epoll</text><path d="M810 315L895 315" stroke="#c2410c" stroke-width="4" fill="none" marker-end="url(#arrow)"/><rect x="915" y="255" width="235" height="120" rx="10" fill="#ffedd5" stroke="#a8a29e"/><text x="1032.5" y="323.0" text-anchor="middle" font-size="23">B의 데이터 처리</text><text x="565" y="420" font-size="22">준비 상태를 확인</text><text x="910" y="420" font-size="22">읽기·해석·응답</text><path d="M1030 450V535H665V460" fill="none" stroke="#c2410c" stroke-width="4" marker-end="url(#arrow)"/><text x="80" y="607" font-size="21">새 연결을 받는 소켓과 기존 연결에서 읽는 소켓을 구분해 관리합니다.</text></g></svg>