<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">보낸 횟수와 읽는 횟수는 다를 수 있다</title><desc id="desc">TCP 에코 실습에서 확인한 바이트 스트림의 관점. 보내기 / 응용 프로그램의 데이터 / 예: 총 8바이트; 전달 / TCP 바이트 스트림 / 응용 메시지 경계는 별도 약속; 읽기 / 여러 번에 나누어 수신 / 예: 3바이트 + 5바이트; 해석 / 길이 또는 구분 규칙 / 필요한 데이터를 모아 처리</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">보낸 횟수와 읽는 횟수는 다를 수 있다</text><text x="56" y="151" font-size="23" fill="#57534e">TCP 에코 실습에서 확인한 바이트 스트림의 관점</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">보내기</text><text x="84" y="294" font-size="25" fill="#44403c">응용 프로그램의 데이터</text><text x="84" y="338" font-size="22" fill="#78716c">예: 총 8바이트</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">전달</text><text x="646" y="294" font-size="25" fill="#44403c">TCP 바이트 스트림</text><text x="646" y="338" font-size="22" fill="#78716c">응용 메시지 경계는 별도 약속</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">읽기</text><text x="84" y="499" font-size="25" fill="#44403c">여러 번에 나누어 수신</text><text x="84" y="543" font-size="22" fill="#78716c">예: 3바이트 + 5바이트</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">해석</text><text x="646" y="499" font-size="25" fill="#44403c">길이 또는 구분 규칙</text><text x="646" y="543" font-size="22" fill="#78716c">필요한 데이터를 모아 처리</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">8바이트와 수신 분할은 설명용 예시이며 실제 패킷 측정값이 아닙니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>