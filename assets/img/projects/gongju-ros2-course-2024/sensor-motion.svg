<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680"><rect width="1200" height="680" fill="#f4f1e9"/><style>text{font-family:Arial,"Malgun Gothic",sans-serif;fill:#292524}.label{font-size:23px;font-weight:700}.detail{font-size:21px}</style><text x="56" y="74" font-size="35" font-weight="700">센서 입력을 속도 명령으로 연결하기</text><text x="56" y="119" font-size="21">move_turtlebot_s.py에 남은 조건과 처리 흐름</text><rect x="40" y="157" width="1120" height="134" rx="12" fill="white"/><rect x="40" y="157" width="8" height="134" fill="#c2410c"/><text class="label" x="65" y="199">01 / INPUT</text><text class="label" x="328" y="199">scan 수신</text><path d="M675 192h64l-12 -9m12 9l-12 9" stroke="#c2410c" stroke-width="3" fill="none"/><text class="label" x="770" y="199">ranges[359]</text><text class="detail" x="65" y="255">LaserScan 메시지를 보관하고 특정 거리값 하나를 참조</text><rect x="40" y="312" width="1120" height="134" rx="12" fill="white"/><rect x="40" y="312" width="8" height="134" fill="#c2410c"/><text class="label" x="65" y="354">02 / DECISION</text><text class="label" x="328" y="354">0.1 &lt; 거리 &lt; 0.5</text><path d="M675 347h64l-12 -9m12 9l-12 9" stroke="#c2410c" stroke-width="3" fill="none"/><text class="label" x="770" y="354">정지 명령</text><text class="detail" x="65" y="410">조건 안에서는 선속도·각속도 0 / 그 밖에서는 시간에 따라 직진·회전</text><rect x="40" y="467" width="1120" height="134" rx="12" fill="white"/><rect x="40" y="467" width="8" height="134" fill="#c2410c"/><text class="label" x="65" y="509">03 / OUTPUT</text><text class="label" x="328" y="509">Twist 메시지</text><path d="M675 502h64l-12 -9m12 9l-12 9" stroke="#c2410c" stroke-width="3" fill="none"/><text class="label" x="770" y="509">cmd_vel 발행</text><text class="detail" x="65" y="565">선속도 ±0.21 · 각속도 ±2.00 범위로 제한하는 발행 콜백</text></svg>