<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">기기의 사용 상태를 공유하기</title><desc id="desc">공용 기기 사례. 사용 요청 / 웹에서 사용 여부 확인 / 승인 상태 관리; 장치 입력 / 허용된 상태의 스위치 / 기기 시작 이벤트; 상태 전달 / UART와 C 프로그램 / DB 상태 갱신; 조회 / 사용 가능 여부 확인 / 화면과 장치 상태 연결</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">기기의 사용 상태를 공유하기</text><text x="56" y="151" font-size="23" fill="#57534e">공용 기기 사례</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">사용 요청</text><text x="84" y="294" font-size="25" fill="#44403c">웹에서 사용 여부 확인</text><text x="84" y="338" font-size="22" fill="#78716c">승인 상태 관리</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">장치 입력</text><text x="646" y="294" font-size="25" fill="#44403c">허용된 상태의 스위치</text><text x="646" y="338" font-size="22" fill="#78716c">기기 시작 이벤트</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">상태 전달</text><text x="84" y="499" font-size="25" fill="#44403c">UART와 C 프로그램</text><text x="84" y="543" font-size="22" fill="#78716c">DB 상태 갱신</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">조회</text><text x="646" y="499" font-size="25" fill="#44403c">사용 가능 여부 확인</text><text x="646" y="543" font-size="22" fill="#78716c">화면과 장치 상태 연결</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">사용자 계정·실제 로그를 포함하지 않은 기능 구성도입니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>