<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">자동 제어와 외부 정보를 함께 다루기</title><desc id="desc">생활 공간 자동화 사례. 센서 입력 / 조도 · 움직임 / 주변 상태 확인; 제어 모드 / 자동 동작 · UART 명령 / 조명과 블라인드 동작; 외부 정보 / API → PC → MySQL / 날씨 데이터 처리; 장치 표시 / 조회 → 시리얼 → LCD / 보드에서 정보 표시</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">자동 제어와 외부 정보를 함께 다루기</text><text x="56" y="151" font-size="23" fill="#57534e">생활 공간 자동화 사례</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">센서 입력</text><text x="84" y="294" font-size="25" fill="#44403c">조도 · 움직임</text><text x="84" y="338" font-size="22" fill="#78716c">주변 상태 확인</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">제어 모드</text><text x="646" y="294" font-size="25" fill="#44403c">자동 동작 · UART 명령</text><text x="646" y="338" font-size="22" fill="#78716c">조명과 블라인드 동작</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">외부 정보</text><text x="84" y="499" font-size="25" fill="#44403c">API → PC → MySQL</text><text x="84" y="543" font-size="22" fill="#78716c">날씨 데이터 처리</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">장치 표시</text><text x="646" y="499" font-size="25" fill="#44403c">조회 → 시리얼 → LCD</text><text x="646" y="543" font-size="22" fill="#78716c">보드에서 정보 표시</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">모터 종류의 자료 간 차이는 본문에 명시하고 제어 역할만 표현했습니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>