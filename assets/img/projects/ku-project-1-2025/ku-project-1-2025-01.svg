<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">장치에서 사용자 화면까지</title><desc id="desc">첫 번째 프로젝트에서 연결한 역할. 입력 / 온습도 · 조도 · 스위치 / 상태를 데이터로 읽기; 판단 / 제어 / 조건과 명령 처리 / LED · 모터 · 표시 장치; 전달 / 저장 / PC와 UART · MySQL / 상태를 기록하고 조회; 서비스 / 모니터링 · 사용 승인 / 사용자가 확인하는 흐름</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">장치에서 사용자 화면까지</text><text x="56" y="151" font-size="23" fill="#57534e">첫 번째 프로젝트에서 연결한 역할</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">입력</text><text x="84" y="294" font-size="25" fill="#44403c">온습도 · 조도 · 스위치</text><text x="84" y="338" font-size="22" fill="#78716c">상태를 데이터로 읽기</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">판단 / 제어</text><text x="646" y="294" font-size="25" fill="#44403c">조건과 명령 처리</text><text x="646" y="338" font-size="22" fill="#78716c">LED · 모터 · 표시 장치</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">전달 / 저장</text><text x="84" y="499" font-size="25" fill="#44403c">PC와 UART · MySQL</text><text x="84" y="543" font-size="22" fill="#78716c">상태를 기록하고 조회</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">서비스</text><text x="646" y="499" font-size="25" fill="#44403c">모니터링 · 사용 승인</text><text x="646" y="543" font-size="22" fill="#78716c">사용자가 확인하는 흐름</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">서로 다른 사례의 공통 역할을 정리했으며 모든 기능이 한 작품에 들어간 것은 아닙니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>