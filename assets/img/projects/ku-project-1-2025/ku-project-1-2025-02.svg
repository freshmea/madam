<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">환경을 측정하고 제어하는 사례</title><desc id="desc">센서 · 출력 · 기록의 역할. 측정 / 온습도 · 조도 · 토양 수분 / 환경 데이터를 읽기; 조건 판단 / 수분과 밝기의 상태 / 제어 기준과 비교; 출력 / 서보 급수 · LED · LCD / 장치 동작과 상태 표시; 기록 / C 프로그램 · UART · DB / 측정값을 저장하고 조회</desc><rect width="1200" height="720" fill="#faf8f4"/><rect x="0" y="0" width="12" height="720" fill="#c2410c"/><g font-family="Malgun Gothic, Noto Sans KR, sans-serif"><text x="56" y="52" font-size="17" font-weight="700" fill="#9a3412">MADAM / KU 2025 / COURSE NOTES</text><text x="56" y="108" font-size="36" font-weight="800" fill="#292524">환경을 측정하고 제어하는 사례</text><text x="56" y="151" font-size="23" fill="#57534e">센서 · 출력 · 기록의 역할</text><rect x="56" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="195" width="8" height="181" rx="4" fill="#1d4ed8"/><text x="82" y="237" font-size="17" font-weight="800" fill="#1d4ed8">01</text><text x="128" y="240" font-size="28" font-weight="800" fill="#292524">측정</text><text x="84" y="294" font-size="25" fill="#44403c">온습도 · 조도 · 토양 수분</text><text x="84" y="338" font-size="22" fill="#78716c">환경 데이터를 읽기</text><rect x="618" y="195" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="195" width="8" height="181" rx="4" fill="#047857"/><text x="644" y="237" font-size="17" font-weight="800" fill="#047857">02</text><text x="690" y="240" font-size="28" font-weight="800" fill="#292524">조건 판단</text><text x="646" y="294" font-size="25" fill="#44403c">수분과 밝기의 상태</text><text x="646" y="338" font-size="22" fill="#78716c">제어 기준과 비교</text><rect x="56" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="56" y="400" width="8" height="181" rx="4" fill="#c2410c"/><text x="82" y="442" font-size="17" font-weight="800" fill="#c2410c">03</text><text x="128" y="445" font-size="28" font-weight="800" fill="#292524">출력</text><text x="84" y="499" font-size="25" fill="#44403c">서보 급수 · LED · LCD</text><text x="84" y="543" font-size="22" fill="#78716c">장치 동작과 상태 표시</text><rect x="618" y="400" width="526" height="181" rx="18" fill="white" stroke="#d6d3d1"/><rect x="618" y="400" width="8" height="181" rx="4" fill="#7c3aed"/><text x="644" y="442" font-size="17" font-weight="800" fill="#7c3aed">04</text><text x="690" y="445" font-size="28" font-weight="800" fill="#292524">기록</text><text x="646" y="499" font-size="25" fill="#44403c">C 프로그램 · UART · DB</text><text x="646" y="543" font-size="22" fill="#78716c">측정값을 저장하고 조회</text><path d="M56 621H1144" stroke="#d6d3d1"/><text x="56" y="660" font-size="19" fill="#57534e">기술서의 구성을 재구성한 도해이며 생장 효과나 장기 안정성의 측정 자료가 아닙니다.</text><text x="56" y="696" font-size="15" fill="#78716c">수업 기록을 바탕으로 직접 제작한 설명용 도해 · 실제 사진 / 측정 결과 아님</text></g></svg>